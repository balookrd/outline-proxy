[package]
name = "outline-ws-rust"
version = "1.9.2"
edition = "2024"

# Feature flags
# -------------
# default: full VM/server build — H3/QUIC + Prometheus metrics + control API
# (the dashboard UI lives in bins/outline-ui). Each feature below is opt-out via `--no-default-features` for
# custom slim builds on memory-constrained devices.
[lints]
workspace = true

[features]
default = ["h3", "metrics", "control", "env-filter", "multi-thread", "jemalloc", "tun", "socks5"]
# SOCKS5 ingress (src/proxy). Off on Android, where the native TUN carries all
# traffic and the whole 5.3k-LOC ingress can be compiled out.
socks5 = []
# TUN device support (transparent proxy). No longer forces metrics: on Android
# (`tun` without `metrics`) the engine's metric calls resolve to outline-metrics
# no-op stubs. See `metrics` below for the weak-feature that re-adds TUN metrics.
tun = ["dep:outline-tun"]
h3 = ["outline-transport/h3", "outline-tun?/quic", "outline-uplink/quic"]
metrics = ["outline-metrics/prometheus", "outline-transport/metrics", "outline-uplink/metrics", "outline-tun?/metrics", "dep:serde_json", "hyper/server"]
# control: authenticated mutating HTTP plane (manual uplink switch etc.).
# Independent of `metrics`; both planes bind separate sockets but share hyper's server stack.
control = ["hyper/server", "dep:serde_json", "dep:toml_edit"]
# env-filter: dynamic log level via RUST_LOG (pulls in regex, ~300 KB on MIPS).
# Opt out via `--no-default-features` — log level falls back to WARN instead.
env-filter = ["tracing-subscriber/env-filter"]
# multi-thread: tokio work-stealing scheduler. Opt out via `--no-default-features`
# for a single-threaded build, removing ~100–200 KB of scheduler code on MIPS.
multi-thread = ["tokio/rt-multi-thread"]
# mimalloc: the previous default, kept buildable for comparison and rollback.
# Measured against jemalloc on 2026-08-22/23 (see the spec below) and dropped
# from `default`: at matched load it held 143 MiB against jemalloc's 30 on the
# same node, because it cannot return a partly-used arena and its arenas are
# 32 MiB at minimum.
mimalloc = ["dep:mimalloc", "dep:libmimalloc-sys"]
# jemalloc: alternative allocator, mutually exclusive with `mimalloc`. Built to
# answer one question mimalloc cannot: it reports live bytes (`stats.allocated`)
# next to what it holds from the OS (`stats.resident`), so fragmentation is
# measured rather than inferred. It also decays dirty pages per extent instead
# of per 32+ MiB arena, which is exactly where mimalloc could not give memory
# back on our nodes.
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]
# test-tls: integration-only. Lets the binary trust a self-signed root supplied
# via the OUTLINE_WS_TEST_TLS_CA_DER env var (forwarded to
# outline_transport::install_test_tls_root) so e2e tests can drive TLS and H3
# carriers against a local self-signed server. NEVER in `default` —
# production builds omit the env hook and the install symbol entirely.
test-tls = ["outline-transport/test-tls"]

[dependencies]
anyhow = { workspace = true }
arc-swap = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true, default-features = true, features = ["derive", "env"] }
futures-util = { workspace = true, features = ["sink", "std"] }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["client", "http1", "http2"] }
hyper-util = { workspace = true, features = ["tokio"] }
libc = { workspace = true, default-features = true }
libmimalloc-sys = { workspace = true, features = ["extended"], optional = true }
lru = { workspace = true }
mimalloc = { workspace = true, optional = true }
tikv-jemallocator = { workspace = true, features = ["background_threads", "stats", "unprefixed_malloc_on_supported_platforms"], optional = true }
tikv-jemalloc-ctl = { workspace = true, features = ["stats"], optional = true }
outline-metrics = { path = "../../crates/outline-metrics", default-features = false }
outline-net = { path = "../../crates/outline-net" }
outline-routing = { path = "../../crates/outline-routing" }
outline-transport = { path = "../../crates/outline-transport" }
outline-tun = { path = "../../crates/outline-tun", default-features = false, optional = true }
outline-uplink = { path = "../../crates/outline-uplink", default-features = false }
outline-wire = { path = "../../crates/outline-wire" }
parking_lot = { workspace = true }
rand = { workspace = true }
rustls = { workspace = true, features = ["aws_lc_rs", "std"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
shadowsocks-crypto = { path = "../../crates/shadowsocks-crypto" }
socket2 = { workspace = true }
socks5-proto = { path = "../../crates/socks5-proto" }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt", "signal", "sync", "time"] }
tokio-rustls = { workspace = true, features = ["aws_lc_rs", "tls12"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
toml = { workspace = true }
toml_edit = { workspace = true, optional = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "tracing-log"] }
url = { workspace = true, features = ["serde"] }
webpki-roots = { workspace = true }

[dev-dependencies]
outline-uplink = { path = "../../crates/outline-uplink", default-features = false, features = ["test-helpers"] }
# rcgen: e2e harness self-signed CA + leaf generation (aws_lc_rs backend per
# the workspace single-CryptoProvider invariant). 0.14.x is already in Cargo.lock.
rcgen = { workspace = true, features = ["pem", "aws_lc_rs"] }
# serde_json: parse the client's /control/topology JSON in the e2e harness,
# independent of the `metrics`/`control` features that gate the runtime copy.
serde_json = { workspace = true }
tempfile = { workspace = true }
# rt-multi-thread + net/io drive the e2e harness's background echo / blackhole /
# splice servers; test-util stays for the existing time-paused unit tests.
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }
