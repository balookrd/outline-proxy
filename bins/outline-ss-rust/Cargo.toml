[package]
name = "outline-ss-rust"
version = "1.9.2"
edition = "2024"

[lints]
workspace = true

[dependencies]
aes = { workspace = true }
anyhow = { workspace = true }
arc-swap = { workspace = true }
axum = { workspace = true, features = ["ws", "http2"] }
base64 = { workspace = true, features = ["std"] }
blake3 = { workspace = true }
bytes = { workspace = true }
chacha20poly1305 = { workspace = true }
clap = { workspace = true, default-features = true, features = ["derive", "env"] }
dashmap = { workspace = true }
futures-util = { workspace = true, features = ["sink", "std"] }
h3 = { workspace = true }
h3-quinn = { workspace = true }
hyper = { workspace = true, features = ["client", "http1", "http2", "server"] }
hyper-util = { workspace = true, features = ["client", "client-legacy", "http1", "http2", "server", "server-auto", "service", "tokio"] }
http-body-util = { workspace = true }
libc = { workspace = true, default-features = true }
libmimalloc-sys = { workspace = true, features = ["extended"], optional = true }
lru = { workspace = true, default-features = true }
mimalloc = { workspace = true, optional = true }
tikv-jemallocator = { workspace = true, features = ["background_threads", "stats", "unprefixed_malloc_on_supported_platforms"], optional = true }
tikv-jemalloc-ctl = { workspace = true, features = ["stats"], optional = true }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
metrics-util = { version = "0.20", default-features = false, features = ["recency"] }
outline-net = { path = "../../crates/outline-net" }
outline-wire = { path = "../../crates/outline-wire", features = ["clap", "h3-datagram"] }
parking_lot = { workspace = true }
quinn = { workspace = true, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
rand = { workspace = true }
# rcgen on the aws_lc_rs backend, matching the workspace-wide single rustls
# CryptoProvider (aws-lc-rs). Used both in tests and, in production, by the
# cluster mesh to build its PSK-derived self-signed interconnect certificate.
rcgen = { workspace = true, features = ["pem", "aws_lc_rs"] }
# ring stays for the Shadowsocks AEAD / SHA-256 paths in `src/crypto/*`; it is
# NOT the rustls CryptoProvider (that is aws-lc-rs, see `rustls` below).
ring = { workspace = true }
rustls = { workspace = true, features = ["aws_lc_rs", "std"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
socket2 = { workspace = true }
sockudo-ws = { version = "1.7.3", default-features = false, features = ["tokio", "http3", "fastrand"] }
subtle = "2.6"
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "sync", "time", "io-util", "macros", "signal"] }
tokio-rustls = { workspace = true, features = ["logging", "tls12", "aws_lc_rs"] }
tungstenite = { version = "0.29", default-features = false }
toml = { workspace = true }
toml_edit = { workspace = true, features = ["serde"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter", "tracing-log"] }
webpki-roots = { workspace = true }
x509-parser = "0.18"
zeroize = { workspace = true }

[features]
default = ["control", "jemalloc"]
control = []
# Allocator, mutually exclusive. jemalloc is the default since 2026-08-23: on
# the client it cut RSS from 143 MiB to 30 at matched load, and the server has
# the same symptom — 87-90% of its resident memory sits in dirty mimalloc
# arenas that never come back, because a partly-used arena cannot be returned
# and arenas are 32 MiB at minimum. `mimalloc` stays buildable for rollback.
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]
mimalloc = ["dep:mimalloc", "dep:libmimalloc-sys"]
# Integration-test hooks, never enabled in release builds: lets the e2e harness
# shorten the relay keepalive (and with it the pong deadline and the xhttp idle
# eviction) through `OUTLINE_SS_TEST_WS_KEEPALIVE_SECS`.
test-hooks = []

[dev-dependencies]
proptest = { workspace = true }
# `test-util` enables tokio's paused virtual clock so timer-driven paths
# (e.g. the WebSocket writer's control-flush cadence) can be tested without
# real-time sleeps.
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite = { workspace = true }
# Drives axum routers directly in control-plane tests via `ServiceExt::oneshot`,
# without binding a real listener. The "util" feature is already pulled in
# transitively by axum's own `tower` dependency; no explicit features needed.
tower = { workspace = true }
# End-to-end tests dial the outline-ws-rust client transport against this
# server. Now an in-workspace path dependency (previously cross-repo).
# `metrics` turns the client's counters on, so the HTTP/3 datagram e2e tests
# can read both sides' counters (`outline-metrics` renders the client's).
outline-transport = { path = "../../crates/outline-transport", features = ["h3", "metrics", "test-tls"] }
outline-metrics = { path = "../../crates/outline-metrics" }
url = { workspace = true }
