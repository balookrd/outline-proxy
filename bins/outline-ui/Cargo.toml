[package]
name = "outline-ui"
version = "1.9.1"
edition = "2024"

[features]
default = []
# Embeds the built Svelte bundle (`frontend/dist`) into the binary via
# rust-embed. Off by default so the plain `cargo build`/`cargo test` gate
# needs no `pnpm build` step; the release image build turns it on.
embed-assets = ["dep:rust-embed"]

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true, features = ["http2"] }
base64 = { workspace = true, features = ["std"] }
bytes = { workspace = true }
clap = { workspace = true, default-features = true, features = ["derive", "env"] }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
rust-embed = { version = "8", optional = true, features = ["mime-guess"] }
# aws-lc-rs only: a second provider in the graph panics the rustls default
# provider with "exactly one of aws-lc-rs and ring".
rustls = { workspace = true, features = ["aws_lc_rs", "std"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "sync", "time", "io-util", "macros", "signal"] }
tokio-rustls = { workspace = true, features = ["logging", "tls12", "aws_lc_rs"] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter", "tracing-log"] }
url = { workspace = true, features = ["serde"] }
webpki-roots = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tower = { workspace = true }

[lints]
workspace = true
