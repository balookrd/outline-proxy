<!doctype html>
<html><body><script>
// The WebSocket waits for the fetches: Chrome sends it over h2 (RFC 8441)
// only on a session that already has the server's SETTINGS, and stable
// Chrome may not reuse the navigation's connection for subresources.
Promise.all([
  fetch("/get-xhr"),
  fetch("/post-xhr", {method: "POST", body: "abcd"}),
]).finally(() => new WebSocket("wss://" + location.host + "/ws"));
setTimeout(() => fetch("/again"), 1500);
</script></body></html>
