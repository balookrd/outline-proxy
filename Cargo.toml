[workspace]
resolver = "2"
# Two binaries (server + client) over shared crates. The vendored sockudo-ws
# is listed explicitly so workspace checks see the vendor participant (Cargo
# would otherwise hide an in-tree path dependency).
members = [
    "bins/outline-ss-rust",
    "bins/outline-ws-rust",
    "bins/outline-ui",
    "crates/outline-metrics",
    "crates/outline-net",
    "crates/outline-routing",
    "crates/outline-transport",
    "crates/outline-tun",
    "crates/outline-uplink",
    "crates/outline-wire",
    "crates/shadowsocks-crypto",
    "crates/socks5-proto",
    "vendor/sockudo-ws",
]

# Shared lint policy for our own packages (each opts in via
# `[lints] workspace = true`; the vendored sockudo-ws deliberately does not).
# The remaining allow is deliberate: the verbose generic types around the
# WsSocket carrier abstraction are tracked as refactor work, not lint noise.
# `too_many_arguments` is enforced at the default threshold — the few
# remaining wide constructors carry targeted `#[allow]`s at the definition.
[workspace.lints.clippy]
type_complexity = "allow"
# async_trait generates #[must_use] on futures that Clippy 1.99+ flags as double_must_use.
double_must_use = "allow"
# Every `unsafe` block/impl in our packages carries a `// SAFETY:` comment
# stating the invariant that makes it sound (fd borrowed for the syscall,
# length checked before the write, libc contract, …). Warn so CI catches a
# regression; the vendored crates do not opt into these lints.
undocumented_unsafe_blocks = "warn"

# Versions (and the default-features switch) of every dependency that two or
# more workspace members share. Members inherit them with `workspace = true` and
# add their own features; a version bump is one edit here instead of one per
# manifest. `default-features = false` here means at least one member needs
# them off — members that want the defaults say `default-features = true`.
[workspace.dependencies]
aes = "0.9"
aes-gcm = "0.11"
anyhow = "1.0"
arc-swap = "1.7"
async-trait = "0.1"
axum = "0.8"
base64 = { version = "0.23", default-features = false }
blake3 = "1.8"
bytes = "1.10"
chacha20poly1305 = "0.11"
clap = { version = "4.5", default-features = false }
dashmap = "6.1"
futures-util = { version = "0.3", default-features = false }
h3 = "0.0.8"
h3-quinn = "0.0.10"
hashbrown = "0.17"
hkdf = "0.13"
http = "1.3"
http-body-util = "0.1"
hyper = "1.8"
hyper-util = "0.1"
libc = { version = "0.2", default-features = false }
libmimalloc-sys = { version = "0.1", default-features = false }
lru = { version = "0.19", default-features = false }
md5 = "0.8"
mimalloc = { version = "0.1", default-features = false }
parking_lot = "0.13"
proptest = "1.5"
quinn = { version = "0.11", default-features = false }
rand = "0.10"
rcgen = { version = "0.14", default-features = false }
ring = "0.17"
rustls = { version = "0.23", default-features = false }
serde = "1.0"
serde_json = "1.0"
socket2 = "0.6"
tempfile = "3"
thiserror = "2.0"
tikv-jemalloc-ctl = { version = "0.7", default-features = false }
tikv-jemallocator = { version = "0.7", default-features = false }
tokio = "1.48"
tokio-rustls = { version = "0.26", default-features = false }
tokio-tungstenite = "0.29"
toml = "1"
toml_edit = "0.25"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false }
url = "2.5"
webpki-roots = "1.0"
zeroize = "1.8"

# Shared release profile. lto="fat" + single codegen unit + panic=abort match
# the previous per-repo release builds (ws used lto=true, which is "fat").
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Symbolized build for on-target `perf` profiling: identical codegen to release
# (same opt-level / lto / codegen-units) but keeps symbols + line tables so
# `perf report` resolves ws-rust frames instead of raw `0x...` addresses. Build
# with `cargo build --profile perf-release -p outline-ws-rust` (or the musl
# cross), profile with `perf record -g -F 999 -p $(pidof outline-ws-rust) --
# sleep 30`, then discard — this profile is a measurement tool, not for release.
[profile.perf-release]
inherits = "release"
strip = false
debug = 1

# HTTP/3 WebSocket path depends on these patched copies — do not drop.
[patch.crates-io]
h3 = { path = "vendor/h3" }
# outline-transport builds the patched hyper API (`ext::HeaderCaseMap`, see
# PATCHES.md) to write xhttp_h1 header names in the browser's case.
hyper = { path = "vendor/hyper" }
quinn-proto = { path = "vendor/quinn-proto" }
rustls = { path = "vendor/rustls" }
sockudo-ws = { path = "vendor/sockudo-ws" }
