name: Release
run-name: "${{ github.workflow }} — ${{ github.event.inputs.series != '' && github.event.inputs.series || 'auto' }}"

# Cuts a unified CalVer release (vYY.M.PATCH) across the monorepo:
# bumps the workspace version, lockfiles, Android/Windows/macOS manifests,
# commits `release: cut v...` to main, and prints the `git tag -s` command
# to run locally. Creating a signed tag locally triggers `Tag Release`.

on:
  workflow_dispatch:
    inputs:
      series:
        description: "YY.M CalVer series (пусто = текущий UTC месяц, например 26.11)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release-prepare
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - id: version
        name: Compute next version
        env:
          SERIES: ${{ github.event.inputs.series }}
        run: |
          set -euo pipefail

          if [[ -z "$SERIES" ]]; then
            SERIES="$(date -u +%-y.%-m)"
          fi

          if [[ ! "$SERIES" =~ ^[0-9]{2,}\.([1-9]|1[0-2])$ ]]; then
            echo "invalid CalVer series '$SERIES', expected YY.M without leading zero in month (e.g. 26.11)" >&2
            exit 1
          fi

          git fetch origin '+refs/tags/*:refs/tags/*' --force

          latest="$(git tag -l "v${SERIES}.*" --sort=-v:refname | head -n1)"

          if [[ -n "$latest" ]]; then
            patch="${latest##*.}"
            next=$((patch + 1))
          else
            next=0
          fi

          version="${SERIES}.${next}"
          tag="v${version}"

          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            echo "tag ${tag} already exists" >&2
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Update version files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json
          import os
          import re

          version = os.environ["VERSION"]

          # 1. Root Cargo.toml ([workspace.package])
          root_cargo = Path("Cargo.toml")
          root_text = root_cargo.read_text(encoding="utf-8")
          sec_pattern = re.compile(r"(?ms)^(\[workspace\.package\]\n)(.*?)(?=^\[|\Z)")
          sec_match = sec_pattern.search(root_text)
          if not sec_match:
              raise SystemExit("failed to find [workspace.package] in Cargo.toml")
          sec_body, count = re.subn(
              r'(?m)^version\s*=\s*"[^"]+"$',
              f'version = "{version}"',
              sec_match.group(2),
              count=1,
          )
          if count != 1:
              raise SystemExit("failed to update [workspace.package].version in Cargo.toml")
          new_root = (
              root_text[:sec_match.start(2)]
              + sec_body
              + root_text[sec_match.end(2):]
          )
          root_cargo.write_text(new_root, encoding="utf-8")

          # 2. Root Cargo.lock (all 13 workspace packages owned by this repo)
          workspace_packages = [
              "outline-server",
              "outline-client",
              "outline-ui",
              "outline-windows",
              "outline-metrics",
              "outline-net",
              "outline-routing",
              "outline-transport",
              "outline-tun",
              "outline-uplink",
              "outline-wire",
              "shadowsocks-crypto",
              "socks5-proto",
          ]
          root_lock = Path("Cargo.lock")
          lock_text = root_lock.read_text(encoding="utf-8")
          for pkg in workspace_packages:
              pattern = rf'(\[\[package\]\]\nname = "{re.escape(pkg)}"\nversion = ")([^"]+)(")'
              lock_text, count = re.subn(pattern, rf'\g<1>{version}\g<3>', lock_text, count=1)
              if count != 1:
                  raise SystemExit(f"failed to update {pkg} version in Cargo.lock")
          root_lock.write_text(lock_text, encoding="utf-8")

          # 3. android/rust/Cargo.toml (detached workspace package)
          android_cargo = Path("android/rust/Cargo.toml")
          android_text = android_cargo.read_text(encoding="utf-8")
          new_android, count = re.subn(
              r'(?m)^version\s*=\s*"[^"]+"$',
              f'version = "{version}"',
              android_text,
              count=1,
          )
          if count != 1:
              raise SystemExit("failed to update package version in android/rust/Cargo.toml")
          android_cargo.write_text(new_android, encoding="utf-8")

          # 4. android/rust/Cargo.lock (outline-android + workspace packages pulled via path)
          android_lock = Path("android/rust/Cargo.lock")
          android_lock_text = android_lock.read_text(encoding="utf-8")
          required_android_pkgs = {"outline-android", "outline-client"}
          for pkg in ["outline-android", *workspace_packages]:
              pattern = rf'(\[\[package\]\]\nname = "{re.escape(pkg)}"\nversion = ")([^"]+)(")'
              android_lock_text, count = re.subn(pattern, rf'\g<1>{version}\g<3>', android_lock_text, count=1)
              if pkg in required_android_pkgs and count != 1:
                  raise SystemExit(f"failed to update {pkg} version in android/rust/Cargo.lock")
          android_lock.write_text(android_lock_text, encoding="utf-8")

          # 5. bins/outline-windows/tauri.conf.json
          tauri_path = Path("bins/outline-windows/tauri.conf.json")
          data = json.loads(tauri_path.read_text(encoding="utf-8"))
          data["version"] = version
          tauri_path.write_text(
              json.dumps(data, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          # 6. macos/Resources/Info.plist
          plist_path = Path("macos/Resources/Info.plist")
          plist_text = plist_path.read_text(encoding="utf-8")
          new_plist, count = re.subn(
              r'(<key>CFBundleShortVersionString</key>\s*<string>)([^<]+)(</string>)',
              rf'\g<1>{version}\g<3>',
              plist_text,
              count=1,
          )
          if count != 1:
              raise SystemExit("failed to update CFBundleShortVersionString in macos/Resources/Info.plist")
          plist_path.write_text(new_plist, encoding="utf-8")
          PY

      - name: Commit
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git add \
            Cargo.toml \
            Cargo.lock \
            android/rust/Cargo.toml \
            android/rust/Cargo.lock \
            bins/outline-windows/tauri.conf.json \
            macos/Resources/Info.plist
          if git diff --cached --quiet; then
            echo "No version file changes for ${TAG}; release will use current HEAD"
          else
            git commit -m "release: cut ${TAG}"
          fi

      - name: Push
        run: |
          set -euo pipefail
          git push origin HEAD:main

      - name: Next steps
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cat <<EOF | tee -a "$GITHUB_STEP_SUMMARY"

          Release commit prepared for \`${TAG}\`.

          Create and push a signed tag locally:

          \`\`\`bash
          git fetch origin
          git checkout main
          git pull --ff-only origin main
          git tag -s ${TAG} -m "${TAG}"
          git push origin ${TAG}
          \`\`\`

          Pushing \`${TAG}\` triggers **Tag Release**, which builds all platforms and publishes the unified GitHub release.
          EOF
