name: Release Build (android)

# Reusable build+publish for the Android app. Builds the native Rust library
# (cargo-ndk) and the UniFFI bindings, then assembles a signed release APK and
# publishes it to a GitHub release. Signing keys come from repository secrets;
# without them the build still runs but produces an unsigned APK.

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      checkout_ref:
        required: false
        type: string
        default: ""
      prerelease:
        required: false
        type: boolean
        default: false
      make_latest:
        required: false
        type: string
        default: "true"
      release_name:
        required: false
        type: string
        default: ""
      version_name:
        required: false
        type: string
        default: ""
      rolling_tag:
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - id: vars
        name: Resolve workflow variables
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          checkout_ref="${{ inputs.checkout_ref }}"
          release_name="${{ inputs.release_name }}"
          version_name="${{ inputs.version_name }}"

          [[ -z "$checkout_ref" ]] && checkout_ref="$tag"
          [[ -z "$release_name" ]] && release_name="Android $tag"
          if [[ -z "$version_name" ]]; then
            case "$tag" in
              android-v*) version_name="${tag#android-v}" ;;
              v*)         version_name="${tag#v}" ;;
              *)          version_name="$tag" ;;
            esac
          fi

          echo "checkout_ref=$checkout_ref" >> "$GITHUB_OUTPUT"
          echo "release_name=$release_name" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.vars.outputs.checkout_ref }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-linux-android

      # zig on PATH: the root .cargo/config.toml force-sets AR/RANLIB to zig for
      # every build; cargo-ndk overrides them per-target for Android, but keep
      # zig available so nothing falls through to a missing `zig ar`.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            android/rust

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v5.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Build native library + UniFFI bindings and assemble APK
        shell: bash
        env:
          BUILD_VERSION_NAME: ${{ steps.vars.outputs.version_name }}
          BUILD_GIT_SHA: ${{ github.sha }}
          # A tagged release is named by its version; a rolling nightly shares one
          # placeholder version, so the app labels it by channel + commit instead.
          BUILD_CHANNEL: ${{ inputs.rolling_tag && 'nightly' || 'release' }}
          KEYSTORE_B64: ${{ secrets.OUTLINE_KEYSTORE_BASE64 }}
          OUTLINE_KEYSTORE_PASSWORD: ${{ secrets.OUTLINE_KEYSTORE_PASSWORD }}
          OUTLINE_KEY_ALIAS: ${{ secrets.OUTLINE_KEY_ALIAS }}
          OUTLINE_KEY_PASSWORD: ${{ secrets.OUTLINE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export BUILD_GIT_SHA="${BUILD_GIT_SHA:0:8}"

          # versionCode decides what Android accepts as an upgrade, and the two
          # channels cannot share a counter: `github.run_number` is per-workflow,
          # so nightly and tag releases both start at 1. Offsetting one channel
          # would only move the problem — it makes the other channel permanently
          # uninstallable over it. Stamp build time instead (epoch minutes, well
          # inside the 2^31 ceiling): the newer build always wins, whichever
          # channel it came from, so switching channels works in both directions.
          export BUILD_VERSION_CODE=$(( $(date -u +%s) / 60 ))
          echo "versionCode: $BUILD_VERSION_CODE"

          # Signing is all-or-nothing (see app/build.gradle.kts): export the
          # keystore path only when a key is actually present, else build unsigned.
          if [[ -n "${KEYSTORE_B64:-}" ]]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export OUTLINE_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
            echo "Release signing: enabled"
          else
            echo "Release signing: disabled (no OUTLINE_KEYSTORE_BASE64 secret) — APK will be unsigned"
          fi

          cd android
          # ANDROID_NDK_LATEST_HOME is set by the runner image, not by this
          # workflow, so it is only reachable through the shell here — NOT via the
          # `env`/`${{ env.* }}` context, which does not carry runner-provided env
          # vars. cargo-ndk reads ANDROID_NDK_HOME; the runner ships several NDKs
          # and *_LATEST_HOME points at the newest.
          ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" ./build-rust.sh arm64-v8a --release
          ./gradlew :app:assembleRelease --console=plain

      - name: Stage APK
        shell: bash
        env:
          VERSION_NAME: ${{ steps.vars.outputs.version_name }}
          ROLLING: ${{ inputs.rolling_tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          src=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          # A tagged release carries its version; nightlies all share the one
          # rolling `android-nightly` tag, so name them by the commit instead to
          # keep successive nightly APKs distinguishable.
          if [[ "$ROLLING" == "true" ]]; then
            name="outline-proxy-nightly-${SHA:0:8}-arm64-v8a.apk"
          else
            name="outline-proxy-${VERSION_NAME}-arm64-v8a.apk"
          fi
          cp "$src" "dist/$name"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-android-arm64-v8a
          path: dist/*.apk
          if-no-files-found: error
          # Consumed by the publish job minutes later; a short retention keeps
          # these from exhausting the shared artifact storage quota.
          retention-days: 1

  publish:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ inputs.rolling_tag }}
        with:
          fetch-depth: 0

      - name: Move rolling tag
        if: ${{ inputs.rolling_tag }}
        env:
          TAG: ${{ inputs.tag }}
          REF: ${{ inputs.checkout_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin --tags --force
          git tag -f "$TAG" "$REF"
          git push origin "refs/tags/$TAG" --force

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-android-*
          merge-multiple: true
          path: dist

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.apk > SHA256SUMS.txt

      - name: Delete old rolling assets
        if: ${{ inputs.rolling_tag }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Rolling release does not exist yet, nothing to clean."
            exit 0
          fi
          mapfile -t assets < <(gh release view "$TAG" --json assets --jq '.assets[].name')
          for asset in "${assets[@]:-}"; do
            [[ -z "$asset" ]] && continue
            echo "Deleting old asset: $asset"
            gh release delete-asset "$TAG" "$asset" --yes
          done

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.release_name != '' && inputs.release_name || format('Android {0}', inputs.tag) }}
          prerelease: ${{ inputs.prerelease }}
          make_latest: ${{ inputs.make_latest }}
          generate_release_notes: ${{ !inputs.rolling_tag }}
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
