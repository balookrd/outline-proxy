name: Release (macos)
run-name: "${{ github.workflow }} — ${{ inputs.major_minor }}"

# Helper for cutting a macOS app release. It bumps the version in
# macos/Resources/Info.plist, commits `release: cut macos-v...` on main,
# and prints the exact `git tag -s` command to run locally.

on:
  workflow_dispatch:
    inputs:
      major_minor:
        description: "MAJOR.MINOR (например 1.9)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: macos-release-${{ github.event.inputs.major_minor }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - id: version
        name: Compute next version
        env:
          SERIES: ${{ github.event.inputs.major_minor }}
        run: |
          set -euo pipefail

          if [[ ! "$SERIES" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "invalid format, expected 1.9" >&2
            exit 1
          fi

          git fetch origin '+refs/tags/*:refs/tags/*' --force

          latest="$(git tag -l "macos-v${SERIES}.*" --sort=-v:refname | head -n1)"

          if [[ -n "$latest" ]]; then
            patch="${latest##*.}"
            next=$((patch+1))
          else
            next=0
          fi

          version="${SERIES}.${next}"
          tag="macos-v${version}"

          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            echo "tag ${tag} already exists" >&2
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Update Info.plist
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import os
          import re

          version = os.environ["VERSION"]
          path = Path("macos/Resources/Info.plist")
          text = path.read_text()

          new_text, count = re.subn(
              r'(<key>CFBundleShortVersionString</key>\s*<string>)[^<]+(</string>)',
              r'\g<1>' + version + r'\2',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("failed to update CFBundleShortVersionString in macos/Resources/Info.plist")

          path.write_text(new_text)
          PY

      - name: Commit
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git add macos/Resources/Info.plist
          if git diff --cached --quiet; then
            echo "No version file changes for ${TAG}; release will use current HEAD"
          else
            git commit -m "release: cut ${TAG}"
          fi

      - name: Push
        run: |
          set -euo pipefail
          git push origin HEAD:main

      - name: Next steps
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cat <<EOF

          Release commit pushed to main.

          Create it as a SIGNED tag locally — your signature is what makes the
          GitHub release show as Verified; CI cannot sign as you — then push it:

            git fetch origin
            git checkout main
            git pull --ff-only origin main
            git tag -s ${TAG} -m "${TAG}"
            git push origin ${TAG}

          Pushing a macos-v* tag triggers "Tag Release (macos)", which builds
          and publishes the Universal DMG image for that tag.

          EOF
