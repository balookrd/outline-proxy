name: Tag Release (windows)
run-name: "${{ github.workflow }} — ${{ github.ref_name }}"

on:
  push:
    tags:
      - "windows-v*"

permissions:
  contents: write

concurrency:
  group: windows-tag-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/_windows-release-build.yml
    with:
      tag: ${{ github.ref_name }}
      prerelease: false
      make_latest: true
    secrets: inherit
