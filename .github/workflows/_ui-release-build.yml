name: Release Build (ui)

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      checkout_ref:
        required: false
        type: string
        default: ""
      prerelease:
        required: false
        type: boolean
        default: false
      make_latest:
        required: false
        type: string
        default: "true"
      release_name:
        required: false
        type: string
        default: ""
      artifact_version:
        required: false
        type: string
        default: ""
      rolling_tag:
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - alias: ui-release-musl-x86_64
            target: x86_64-unknown-linux-musl

          - alias: ui-release-musl-aarch64
            target: aarch64-unknown-linux-musl

    steps:
      - id: vars
        name: Resolve workflow variables
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ inputs.tag }}"
          checkout_ref="${{ inputs.checkout_ref }}"
          release_name="${{ inputs.release_name }}"
          artifact_version="${{ inputs.artifact_version }}"

          if [[ -z "$checkout_ref" ]]; then
            checkout_ref="$tag"
          fi

          if [[ -z "$release_name" ]]; then
            release_name="UI $tag"
          fi

          if [[ -z "$artifact_version" ]]; then
            case "$tag" in
              ui-v*) artifact_version="${tag#ui-v}" ;;
              v*)    artifact_version="${tag#v}" ;;
              *)     artifact_version="$tag" ;;
            esac
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=$checkout_ref" >> "$GITHUB_OUTPUT"
          echo "release_name=$release_name" >> "$GITHUB_OUTPUT"
          echo "artifact_version=$artifact_version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.vars.outputs.checkout_ref }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      # node20 deprecation warning on this step: known and safe — see the
      # note on the setup-zig step in ci.yml (lint job).
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.1

      - name: Install Rust target
        run: rustup target add "${{ matrix.target }}"

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      # The `ui-release-musl-*` aliases build only `-p outline-ui` within the
      # workspace; outline-ui pulls in no in-workspace crates, so no sibling
      # checkout is needed.
      - name: Build release binary
        run: cargo "${{ matrix.alias }}"

      - name: Package artifact
        env:
          VERSION: ${{ steps.vars.outputs.artifact_version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          name="outline-ui-v${VERSION}-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/outline-ui" "dist/${name}"
          chmod +x "dist/${name}"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ steps.vars.outputs.tag }}-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          # These are consumed by the `publish` job minutes later; nothing
          # reads them afterwards. Without a short retention they pile up: a
          # release build runs on every push, so even the 7-day window kept
          # ~210 copies of each binary — 4.7 GiB — which exhausted the
          # private-repo artifact storage quota and failed every upload with
          # "Artifact storage quota has been hit". 1 day is the floor and still
          # outlives the publish job that consumes them minutes later.
          retention-days: 1

  publish:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ inputs.rolling_tag }}
        with:
          fetch-depth: 0

      - name: Move rolling tag
        if: ${{ inputs.rolling_tag }}
        env:
          TAG: ${{ inputs.tag }}
          REF: ${{ inputs.checkout_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin --tags --force
          git tag -f "$TAG" "$REF"
          git push origin "refs/tags/$TAG" --force

      - name: Reset rolling release
        if: ${{ inputs.rolling_tag }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          # First rolling run: the release does not exist yet. `gh release
          # view` returns non-zero, so skip cleanly instead of feeding a 404
          # body into the DELETE below.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Rolling release $TAG does not exist yet, nothing to reset."
            exit 0
          fi

          release_id="$(gh api "/repos/${REPO}/releases/tags/${TAG}" --jq '.id' 2>/dev/null || true)"
          if [[ "$release_id" =~ ^[0-9]+$ ]]; then
            gh api -X DELETE "/repos/${REPO}/releases/${release_id}"
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz > SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.release_name != '' && inputs.release_name || format('UI {0}', inputs.tag) }}
          prerelease: ${{ inputs.prerelease }}
          make_latest: ${{ inputs.make_latest }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS.txt
