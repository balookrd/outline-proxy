name: Release (android)

on:
  workflow_dispatch:
    inputs:
      major_minor:
        description: "MAJOR.MINOR (например 0.1)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.event.inputs.major_minor }}
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - id: version
        name: Compute next version
        env:
          SERIES: ${{ github.event.inputs.major_minor }}
        run: |
          set -euo pipefail

          if [[ ! "$SERIES" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "invalid format, expected 0.1" >&2
            exit 1
          fi

          git fetch origin '+refs/tags/*:refs/tags/*' --force

          latest="$(git tag -l "android-v${SERIES}.*" --sort=-v:refname | head -n1)"

          if [[ -n "$latest" ]]; then
            patch="${latest##*.}"
            next=$((patch+1))
          else
            next=0
          fi

          version="${SERIES}.${next}"
          tag="android-v${version}"

          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            echo "tag ${tag} already exists" >&2
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          # Unlike Release (server|client|ui), there is no in-file version to bump:
          # app/build.gradle.kts reads versionName from BUILD_VERSION_NAME, which
          # Tag Release (android) injects from the tag name. So there is nothing to
          # commit — cut the tag straight from the dispatched ref. Pushing an
          # android-v* tag triggers Tag Release (android), which builds and
          # publishes the signed APK.
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

      - name: Next steps
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cat <<EOF

          Tag ${TAG} pushed to origin.

          Workflow "Tag Release (android)" now builds the APK for that tag and
          publishes it as a GitHub release.

          EOF
