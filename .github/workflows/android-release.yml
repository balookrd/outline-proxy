name: Release (android)

# Helper for cutting an Android release. It does NOT create the tag: the release
# tag must be signed with the maintainer's key so the GitHub release shows as
# Verified, and CI cannot sign as the maintainer. So this only computes the next
# android-vMAJOR.MINOR.PATCH and prints the exact `git tag -s` command to run
# locally. (Unlike Release (server|client|ui) there is also no in-file version to
# bump: app/build.gradle.kts reads versionName from BUILD_VERSION_NAME, which Tag
# Release (android) injects from the tag name.)

on:
  workflow_dispatch:
    inputs:
      major_minor:
        description: "MAJOR.MINOR (например 0.1)"
        required: true
        type: string

jobs:
  compute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - id: version
        name: Compute next version
        env:
          SERIES: ${{ github.event.inputs.major_minor }}
        run: |
          set -euo pipefail

          if [[ ! "$SERIES" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "invalid format, expected 0.1" >&2
            exit 1
          fi

          git fetch origin '+refs/tags/*:refs/tags/*' --force

          latest="$(git tag -l "android-v${SERIES}.*" --sort=-v:refname | head -n1)"

          if [[ -n "$latest" ]]; then
            patch="${latest##*.}"
            next=$((patch+1))
          else
            next=0
          fi

          version="${SERIES}.${next}"
          tag="android-v${version}"

          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            echo "tag ${tag} already exists" >&2
            exit 1
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Next steps
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cat <<EOF

          Next Android release tag: ${TAG}

          Create it as a SIGNED tag locally — your signature is what makes the
          GitHub release show as Verified; CI cannot sign as you — then push it:

            git fetch origin
            git checkout main
            git pull --ff-only origin main
            git tag -s ${TAG} -m "${TAG}"
            git push origin ${TAG}

          Pushing an android-v* tag triggers "Tag Release (android)", which builds
          and publishes the signed APK for that tag.

          EOF
