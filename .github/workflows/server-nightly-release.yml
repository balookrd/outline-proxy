name: Nightly Release (server)
run-name: "${{ github.workflow }} — ${{ github.sha }}"

on:
  push:
    branches:
      - main
    paths:
      - "bins/outline-server/**"
      - "crates/**"
      - "vendor/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - ".github/workflows/server-nightly-release.yml"
      - ".github/workflows/_server-release-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: server-nightly-release
  cancel-in-progress: true

jobs:
  release:
    if: |
      github.event_name == 'workflow_dispatch' ||
      !startsWith(github.event.head_commit.message, 'release: cut ')
    uses: ./.github/workflows/_server-release-build.yml
    with:
      tag: server-nightly
      checkout_ref: ${{ github.sha }}
      prerelease: true
      make_latest: false
      release_name: Server Nightly
      artifact_version: nightly-${{ github.sha }}
      rolling_tag: true
