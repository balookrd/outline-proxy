name: Nightly Release (macos)
run-name: "${{ github.workflow }} — ${{ github.sha }}"

on:
  push:
    branches:
      - main
    paths:
      - "macos/**"
      - "bins/outline-ws-rust/**"
      - "crates/**"
      - "vendor/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - ".github/workflows/macos-nightly-release.yml"
      - ".github/workflows/_macos-release-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-nightly-release
  cancel-in-progress: true

jobs:
  release:
    if: |
      github.event_name == 'workflow_dispatch' ||
      !startsWith(github.event.head_commit.message, 'release: cut ')
    uses: ./.github/workflows/_macos-release-build.yml
    with:
      tag: macos-nightly
      checkout_ref: ${{ github.sha }}
      prerelease: true
      make_latest: false
      release_name: macOS Nightly
      version_name: nightly
      rolling_tag: true
    secrets: inherit
