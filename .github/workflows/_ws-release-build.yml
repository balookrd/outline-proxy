name: Release Build (client)

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      checkout_ref:
        required: false
        type: string
        default: ""
      prerelease:
        required: false
        type: boolean
        default: false
      make_latest:
        required: false
        type: string
        default: "true"
      release_name:
        required: false
        type: string
        default: ""
      artifact_version:
        required: false
        type: string
        default: ""
      rolling_tag:
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            artifact_name: server-x86_64-unknown-linux-musl
            profile: release
            flavor: server

          - target: aarch64-unknown-linux-musl
            artifact_name: server-aarch64-unknown-linux-musl
            profile: release
            flavor: server

    steps:
      - id: vars
        name: Resolve workflow variables
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ inputs.tag }}"
          checkout_ref="${{ inputs.checkout_ref }}"
          release_name="${{ inputs.release_name }}"
          artifact_version="${{ inputs.artifact_version }}"

          if [[ -z "$checkout_ref" ]]; then
            checkout_ref="$tag"
          fi

          if [[ -z "$release_name" ]]; then
            release_name="Client $tag"
          fi

          if [[ -z "$artifact_version" ]]; then
            case "$tag" in
              ws-v*) artifact_version="${tag#ws-v}" ;;
              v*)    artifact_version="${tag#v}" ;;
              *)     artifact_version="$tag" ;;
            esac
          fi

          echo "checkout_ref=$checkout_ref" >> "$GITHUB_OUTPUT"
          echo "release_name=$release_name" >> "$GITHUB_OUTPUT"
          echo "artifact_version=$artifact_version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ steps.vars.outputs.checkout_ref }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      # node20 deprecation warning on this step: known and safe — see the
      # note on the setup-zig step in ci.yml (lint job).
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.1

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: Build release asset
        shell: bash
        env:
          VERSION: ${{ steps.vars.outputs.artifact_version }}
        run: |
          set -euo pipefail
          ./.github/scripts/build-release-asset.sh \
            "${{ matrix.target }}" \
            "${{ matrix.profile }}" \
            "${{ matrix.flavor }}" \
            dist

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-${{ matrix.artifact_name }}
          path: dist/*.tar.gz
          if-no-files-found: error
          # These are consumed by the `publish` job minutes later; nothing
          # reads them afterwards. Without an explicit retention they inherit
          # the 90-day default, and since a release build runs on every push
          # that accumulated ~210 copies of each binary — 4.7 GiB, which is
          # what exhausted the private-repo artifact storage quota and started
          # failing every upload with "Artifact storage quota has been hit".
          retention-days: 7

  publish:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: ${{ inputs.rolling_tag }}
        with:
          fetch-depth: 0

      - name: Move rolling tag
        if: ${{ inputs.rolling_tag }}
        env:
          TAG: ${{ inputs.tag }}
          REF: ${{ inputs.checkout_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin --tags --force
          git tag -f "$TAG" "$REF"
          git push origin "refs/tags/$TAG" --force

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz > SHA256SUMS.txt

      - name: Delete old nightly assets
        if: ${{ inputs.rolling_tag }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Nightly release does not exist yet, nothing to clean."
            exit 0
          fi

          mapfile -t assets < <(gh release view "$TAG" --json assets --jq '.assets[].name')
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "No old assets to delete."
            exit 0
          fi

          for asset in "${assets[@]}"; do
            echo "Deleting old asset: $asset"
            gh release delete-asset "$TAG" "$asset" --yes
          done

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.release_name != '' && inputs.release_name || format('Client {0}', inputs.tag) }}
          prerelease: ${{ inputs.prerelease }}
          make_latest: ${{ inputs.make_latest }}
          generate_release_notes: ${{ !inputs.rolling_tag }}
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS.txt
