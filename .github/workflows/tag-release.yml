name: Tag Release
run-name: "${{ github.workflow }} — ${{ github.ref_name }}"

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

concurrency:
  group: tag-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_ss:
    name: Build server
    uses: ./.github/workflows/_ss-release-build.yml
    with:
      tag: ${{ github.ref_name }}
      rolling_tag: false
      publish_release: false

  build_ws:
    name: Build client
    uses: ./.github/workflows/_ws-release-build.yml
    with:
      tag: ${{ github.ref_name }}
      rolling_tag: false
      publish_release: false

  build_ui:
    name: Build UI
    uses: ./.github/workflows/_ui-release-build.yml
    with:
      tag: ${{ github.ref_name }}
      rolling_tag: false
      publish_release: false

  build_android:
    name: Build Android
    uses: ./.github/workflows/_android-release-build.yml
    with:
      tag: ${{ github.ref_name }}
      rolling_tag: false
      publish_release: false
    secrets: inherit

  build_macos:
    name: Build macOS
    uses: ./.github/workflows/_macos-release-build.yml
    with:
      tag: ${{ github.ref_name }}
      rolling_tag: false
      publish_release: false

  build_windows:
    name: Build Windows
    uses: ./.github/workflows/_windows-release-build.yml
    with:
      tag: ${{ github.ref_name }}
      rolling_tag: false
      publish_release: false

  publish:
    name: Publish unified release
    runs-on: ubuntu-latest
    needs:
      - build_ss
      - build_ws
      - build_ui
      - build_android
      - build_macos
      - build_windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Verify all release assets are present
        run: |
          set -euo pipefail
          ls -la dist
          shopt -s nullglob
          ss=(dist/outline-ss-rust-*.tar.gz)
          ws=(dist/outline-ws-rust-*.tar.gz)
          ui=(dist/outline-ui-*.tar.gz)
          apk=(dist/outline-proxy-*.apk)
          dmg=(dist/OutlineProxy-*-macOS-Universal.dmg)
          win=(dist/OutlineProxy-*-Windows-x86_64.zip)
          for group in ss ws ui apk dmg win; do
            eval "count=\${#${group}[@]}"
            if [[ "$count" -eq 0 ]]; then
              echo "missing expected release assets for group: ${group}" >&2
              exit 1
            fi
          done

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          LC_ALL=C sha256sum -- *.tar.gz *.apk *.dmg *.zip > SHA256SUMS.txt

      - name: Install git-cliff
        env:
          GIT_CLIFF_VERSION: "2.13.1"
          GIT_CLIFF_SHA256: "9a1263f24e59a2f508c7b3d3283c9dea94a8bf697f96dbc18cc783cac6284546"
        run: |
          set -euo pipefail
          url="https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL "$url" -o /tmp/git-cliff.tar.gz
          echo "${GIT_CLIFF_SHA256}  /tmp/git-cliff.tar.gz" | sha256sum -c -
          tar -xzf /tmp/git-cliff.tar.gz -C /tmp
          sudo install "/tmp/git-cliff-${GIT_CLIFF_VERSION}/git-cliff" /usr/local/bin/git-cliff
          git-cliff --version

      - name: Generate release notes
        env:
          TAG: ${{ github.ref_name }}
        run: .github/scripts/gen-release-notes.sh all "$TAG" release-notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: Outline Proxy ${{ github.ref_name }}
          prerelease: false
          make_latest: true
          body_path: release-notes.md
          files: dist/*
