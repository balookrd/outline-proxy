name: Tag Release (macos)
run-name: "${{ github.workflow }} — ${{ github.ref_name }}"

on:
  push:
    tags:
      - "macos-v*"

permissions:
  contents: write

concurrency:
  group: macos-tag-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/_macos-release-build.yml
    with:
      tag: ${{ github.ref_name }}
      prerelease: false
      make_latest: true
    secrets: inherit
