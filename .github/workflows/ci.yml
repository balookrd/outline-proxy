name: CI

# Quality gate for pull requests and pushes to main. The release workflows
# (`*-release*.yml`) only build artifacts; this is the only workflow that runs
# fmt / clippy / tests / the monorepo invariants, so it is the merge gate.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: rustfmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      # .cargo/config.toml forces AR/RANLIB to `zig ar`/`zig ranlib` for every
      # build (not just the zigbuild cross aliases), so ring's build script
      # needs zig on PATH even for a native host check.
      #
      # The runner's "node20 deprecated" annotation on this step is known and
      # safe: setup-zig v2.2.1 (the pinned release below) still declares node20,
      # and upstream keeps it that way on purpose for ZSF's Debian-stable
      # self-hosted runners (Codeberg mlugg/setup-zig PR #55; the GitHub repo is
      # a read-only mirror). Verified 2026-06-12: the v2.2.1 JS runs the full
      # fetch/extract/tool-cache/zig cycle cleanly under Node 24, so GitHub's
      # 2026-06-16 forced-Node-24 switch is a no-op here.
      #
      # Pinned to a commit SHA (supply-chain hardening), so it no longer floats
      # to newer @v2 releases: bump the SHA (and the trailing `# vX.Y.Z`) by
      # hand to pick up the eventual node24 release. The other setup-zig pins in
      # `_ss-release-build.yml` / `_ws-release-build.yml` must move together.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.1
      # `android/rust` is a detached workspace with its own target dir, so it
      # needs its own cache entry — the default (`.`) never sees it.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            android/rust

      # `cargo fmt --all` would also reformat the vendored `sockudo-ws`
      # workspace member, which we keep in upstream style — so the check lists
      # our own packages explicitly instead of `--all`.
      - name: rustfmt (our crates only; vendored kept in upstream style)
        run: >
          cargo fmt --check
          -p outline-ss-rust -p outline-ws-rust -p outline-ui
          -p outline-metrics -p outline-net -p outline-routing
          -p outline-transport -p outline-tun
          -p outline-uplink -p outline-wire -p shadowsocks-crypto -p socks5-proto

      # `--no-deps` keeps clippy off the vendored members (they are linted as
      # dependencies otherwise). The style/complexity backlog was cleared, so
      # the gate denies everything clippy emits at its default lint levels.
      # `[workspace.lints.clippy]` in the root Cargo.toml adjusts two of them:
      # `type_complexity` is allowed until the god-object refactors land, and
      # `undocumented_unsafe_blocks` is raised to warn — which `-D warnings`
      # turns into a hard failure, so an `unsafe` without a `// SAFETY:`
      # comment cannot merge.
      - name: clippy (deny all default-level warnings)
        run: >
          cargo clippy --workspace --exclude sockudo-ws --all-targets --no-deps --
          -D warnings

      # `android/rust` (package `outline-android`) declares its own empty
      # `[workspace]`, so it is invisible to both steps above: it is neither in
      # the explicit fmt package list nor reachable from `--workspace`. Lint it
      # from its own directory or it drifts unnoticed — which is exactly what
      # happened before these two steps existed.
      - name: rustfmt (detached android workspace)
        working-directory: android/rust
        run: cargo fmt --check

      # No `--all-targets`: the crate has no tests/benches, and its default
      # targets (lib + cdylib + the uniffi-bindgen helper bin) all compile for
      # the host — only linking the cdylib into an app needs an Android target,
      # and clippy stops at the check step. `--no-deps` keeps the gate off the
      # monorepo path dependencies, which the workspace clippy above already
      # covers.
      - name: clippy — android (deny all default-level warnings)
        working-directory: android/rust
        run: cargo clippy --no-deps -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      # zig is required because .cargo/config.toml forces AR/RANLIB to zig for
      # every build (see the lint job for details).
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo test
        run: cargo test --workspace --exclude sockudo-ws

  features-and-invariants:
    name: feature matrix + monorepo invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      # zig is required because .cargo/config.toml forces AR/RANLIB to zig for
      # every build (see the lint job for details).
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: check default workspace
        run: cargo check --workspace --exclude sockudo-ws

      - name: check server without default features (control gated off)
        run: cargo check -p outline-ss-rust --no-default-features

      - name: check client without default features
        run: cargo check -p outline-ws-rust --no-default-features

      # Monorepo invariant: rustls must stay on a single CryptoProvider
      # (aws-lc-rs). Two providers panic at runtime ("exactly one of aws-lc-rs
      # and ring"). The `ring` crate itself stays for SS AEAD / SHA-256, but
      # never as the rustls provider.
      - name: invariant — aws-lc-rs only, no ring rustls provider
        run: |
          if cargo tree -i 'rustls@0.23' -e features 2>/dev/null | grep -q 'rustls feature "ring"'; then
            echo "::error::rustls is pulling its ring provider; the workspace must stay on aws-lc-rs only"
            cargo tree -i 'rustls@0.23' -e features | grep 'rustls feature'
            exit 1
          fi
          echo "ok: rustls is on aws-lc-rs only"

      # Monorepo invariant: every direct sockudo-ws reference in production
      # code stays behind the two vendored-gate modules, so rebasing the
      # vendored crates touches one file per side (see PATCHES.md). Test
      # modules are exempt — they impersonate the client on purpose.
      - name: invariant — vendored sockudo-ws API only behind gate modules
        run: |
          leaked=$(grep -rn 'sockudo_ws' bins/*/src crates/*/src --include='*.rs' \
            | grep -v '/tests/' \
            | grep -v '^crates/outline-transport/src/h3/vendored\.rs:' \
            | grep -v '^bins/outline-ss-rust/src/server/h3/vendored\.rs:' || true)
          if [ -n "$leaked" ]; then
            echo "::error::sockudo_ws referenced outside the vendored gate modules:"
            echo "$leaked"
            exit 1
          fi
          echo "ok: sockudo-ws stays behind the gate modules"

      # Install-script invariants: syntax + shellcheck for the two root
      # installers, and byte-identity of the helpers deliberately duplicated
      # between install-server.sh and install-client.sh (single-file
      # curl|bash delivery rules out a sourced library; this gate replaces
      # it). shellcheck is preinstalled on ubuntu runners.
      - name: invariant — install scripts (syntax, shellcheck, shared helpers)
        run: .github/scripts/check-install-scripts.sh

      # Access-key invariant: the directory the nodes serve <user>.conf /
      # <user>.json / <user>.txt from is unguessable-by-design and unguarded
      # otherwise, so it stays in the node's config.toml and out of the tree.
      # Also refuses tracked *.pyc — that is where the path once survived a
      # history rewrite, textual rewriting having skipped the binary blob.
      - name: invariant — served access-key path stays out of the repo
        run: .github/scripts/check-served-key-path.sh

  frontend:
    name: frontend (svelte-check + vitest + build) + embed-assets
    runs-on: ubuntu-latest
    # outline-ui's `embed-assets` Cargo feature (off by default) bakes this
    # directory's `pnpm build` output into the Rust binary, but that is the
    # only place the two touch. The three jobs above stay entirely node-less
    # — they never build with the feature on, so they never need
    # `frontend/dist` to exist. This job is the frontend's own gate
    # (typecheck, unit tests, production build) and, after that build, the
    # only place in CI that compiles outline-ui with `embed-assets` — see the
    # dedicated step below for why that matters.
    defaults:
      run:
        working-directory: bins/outline-ui/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9
      # pnpm has to already be on PATH (the step above) before setup-node's
      # built-in cache can hash pnpm-lock.yaml and wire up the pnpm store.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: bins/outline-ui/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec svelte-check --tsconfig ./tsconfig.app.json
      - run: pnpm exec vitest run
      - run: pnpm build

      # `embed-assets` is gated nowhere else: the rust-embed derive walks a
      # real `dist` tree at compile time, and this is the only job that ever
      # builds one (the three Rust jobs above stay node-less on purpose, see
      # the job comment). Without this step the branch's core feature —
      # shipping the SPA baked into the binary — could break silently, since
      # every other `cargo build`/`check`/`test` in CI leaves it off.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      # zig is required because .cargo/config.toml forces AR/RANLIB to zig for
      # every build (see the lint job for details).
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo build outline-ui --features embed-assets (needs the dist built above)
        working-directory: ${{ github.workspace }}
        run: cargo build -p outline-ui --features embed-assets
