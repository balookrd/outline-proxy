name: RustSec audit

# RustSec advisories for every crate in both lockfiles, the vendored ones
# included: plain `cargo audit` skips path dependencies, so the crates vendored
# through `[patch.crates-io]` (quinn-proto, rustls, hyper, h3, sockudo-ws) were
# never checked. scripts/audit-vendored.sh audits a copy of each lockfile with
# them marked as crates.io packages. Kept out of ci.yml on purpose: the weekly
# run reports new advisories even when no code changes, and a red audit does
# not hold up an unrelated merge.
on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rustsec-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: cargo audit (vendored crates included)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      # Caches ~/.cargo/bin, so cargo-audit is built once per cache key.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: "false"
      # Installed from outside the checkout: the repository's .cargo/config.toml
      # forces `zig ar`, which this job does not set up.
      - name: install cargo-audit
        working-directory: ${{ runner.temp }}
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: audit both lockfiles
        run: scripts/audit-vendored.sh
