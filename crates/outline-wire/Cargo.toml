[package]
name = "outline-wire"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[features]
# Derives clap::ValueEnum on CipherKind for CLI parsing (server binary).
clap = ["dep:clap"]
# Per-QUIC-connection HTTP/3 datagram demultiplexer (`h3_datagram::DatagramDemux`).
h3-datagram = ["dep:quinn", "dep:tokio"]

[dependencies]
base64 = "0.22"
blake3 = "1.8"
bytes = "1.10"
clap = { version = "4.5", optional = true, default-features = false, features = ["derive", "std"] }
md5 = "0.7"
quinn = { version = "0.11", optional = true, default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.44", optional = true, features = ["rt", "sync"] }
zeroize = "1.8"

[dev-dependencies]
proptest = "1.5"
rcgen = { version = "0.14", default-features = false, features = ["pem", "aws_lc_rs"] }
serde_json = "1.0"
tokio = { version = "1.44", features = ["macros", "rt-multi-thread", "sync", "time"] }
