[package]
name = "outline-wire"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[features]
# Derives clap::ValueEnum on CipherKind for CLI parsing (server binary).
clap = ["dep:clap"]
# Per-QUIC-connection HTTP/3 datagram demultiplexer (`h3_datagram::DatagramDemux`).
h3-datagram = ["dep:quinn", "dep:tokio"]

[dependencies]
base64 = { workspace = true, features = ["std"] }
blake3 = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true, optional = true, features = ["derive", "std"] }
md5 = { workspace = true }
rand = { workspace = true }
quinn = { workspace = true, optional = true, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true, features = ["macros", "rt", "sync", "time"] }
zeroize = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
rcgen = { workspace = true, features = ["pem", "aws_lc_rs"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
