[package]
name = "shadowsocks-crypto"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
aes = "0.9"
aes-gcm = "0.11"
base64 = { version = "0.23", default-features = false, features = ["std"] }
blake3 = "1.8"
chacha20poly1305 = "0.11"
hkdf = "0.13"
md5 = "0.8"
outline-wire = { path = "../outline-wire" }
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }
sha1 = "0.11"
thiserror = "2.0"
zeroize = "1.8"
