[package]
name = "outline-uplink"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[features]
default = ["metrics"]
metrics = ["outline-metrics/prometheus", "cert-check"]
quic = ["outline-transport/quic"]
# Periodic per-uplink TLS certificate-expiry check. Pulls
# `outline-transport/cert-check` (the X.509 parser). Enabled transitively by
# `metrics` and by the top-level `dashboard` feature; left off slim builds.
cert-check = ["outline-transport/cert-check"]
# Exposes test-only public methods on `UplinkManager` (`new_for_test`,
# `test_set_tcp_health`, …). Enabled automatically by dependent crates'
# `[dev-dependencies]` so integration tests can drive uplink state directly.
test-helpers = []

[dependencies]
anyhow = { workspace = true }
arc-swap = { workspace = true }
base64 = { workspace = true, features = ["std"] }
blake3 = { workspace = true }
futures-util = { workspace = true, features = ["sink", "std"] }
libc = { workspace = true, default-features = true }
outline-metrics = { path = "../outline-metrics", default-features = false }
outline-wire = { path = "../outline-wire" }
outline-transport = { path = "../outline-transport" }
parking_lot = { workspace = true }
percent-encoding = "2.3"
rand = { workspace = true }
serde = { workspace = true, features = ["derive"] }
shadowsocks-crypto = { path = "../shadowsocks-crypto" }
socks5-proto = { path = "../socks5-proto" }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true, features = ["serde"] }

[dev-dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
