# Subscription headers for the generated subscriptions (ops/access-keys).
#
# This is NOT a standalone site or a snippet — nginx snippets are not collected
# into the provisioning bundle (`ETC_NGINX_PATHS` in
# ops/provision-node/profiles/cloud1.conf lists only nginx.conf and
# sites-available/beerloga.su). Paste this block inside the `server` block of
# /etc/nginx/sites-available/beerloga.su, before its closing brace, so it
# travels with the reference bundle to every node cloned from it.
#
# profile-title is base64 UTF-8 per the subscription-header convention
# ("Beerloga Cloud" -> QmVlcmxvZ2EgQ2xvdWQ=); clients show it as the name of the
# subscription. profile-update-interval is in HOURS, not minutes.
#
# Applies to both subscription forms: <user>.json (Xray-JSON) and <user>.txt
# (plain list of URIs). The .conf access keys deliberately stay outside — they
# are a single Outline config, not a subscription.
#
# The regex location wins over the `location /` prefix in the same server block,
# so only those two extensions under the access-key directory carry the headers;
# the .conf keys and the exporter routes are untouched.
#
# __KEYS_PREFIX__ is the last path segment of `[access_keys] write_dir` in the
# node's config.toml — substitute it by hand when pasting this block. The
# placeholder is what lives in the repository: that segment is unguessable by
# design and is the only thing between the internet and every user's password
# and vless_id, so it must never be committed (same rule as the heartbeat token
# in ops/heartbeat/nginx-heartbeat.conf).
#
# Verify after a reload:
#   curl -sS -D- --resolve cloud.beerloga.su:443:<node-ip> -o /dev/null \
#     https://cloud.beerloga.su/<keys-prefix>/<user>.txt | grep -i profile-

# Never serve a dotfile. The generator writes each artifact atomically through
# a temp file named `.<user>.<ext>.tmp`; a crash between the write and the
# rename can leave one behind, and it carries the very password and vless_id
# the finished artifact does. nginx serves dotfiles by default, so deny them
# explicitly — 404, not 403, so the response does not even confirm the file is
# there. This regex must precede the headers location below: regex locations
# are tried top-to-bottom and the first match wins.
location ~ /\. {
    return 404;
}

location ~ ^/__KEYS_PREFIX__/[^/]+\.(json|txt)$ {
    add_header profile-title "base64:QmVlcmxvZ2EgQ2xvdWQ=" always;
    add_header profile-update-interval "12" always;
    proxy_pass http://127.0.0.1:80;
}
