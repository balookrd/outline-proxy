# outline-ws-rust client config for the Android app.
# Generated for user own-method — do not edit by hand.

[tun]
path = "vpn"
mtu = 1500

[tun.tcp]
sniffing = true
carrier_migration = true

[padding]
enabled = true

[[uplink_group]]
name = "main"
mode = "active_passive"
routing_scope = "global"
shared_resume = false
reselect_interval = "6h"
tun_wire_dial = true
health_weighted_selection = true
warm_standby_tcp = 0
warm_standby_udp = 0

[outline.load_balancing]
warm_standby_tcp = 0
warm_standby_udp = 0
loss_sample_interval_secs = 0
tcp_ws_standby_keepalive_secs = 0
warm_probe_keepalive_secs = 0
tcp_active_keepalive_secs = 120

[h2]
keepalive_interval_secs = 60
keepalive_timeout_secs = 20

[quic]
keepalive_secs = 25
idle_timeout_secs = 60

[outline.probe]
interval_secs = 300
timeout_secs = 10
min_failures = 2
attempts = 1
endpoint_check = true
endpoint_check_timeout_ms = 2000

[outline.probe.dns]
server = "1.1.1.1"
port = 53
name = "google.com"

[outline.probe.tls]
targets = [
  "www.instagram.com",
  "www.youtube.com",
  "www.googletagmanager.com",
  "www.googlevideo.com",
  "api.telegram.org",
]

