# outline-ws-rust client config for the Android app.
# Generated for user vless-only — do not edit by hand.

[tun]
path = "vpn"
mtu = 1500

[tun.tcp]
sniffing = true
carrier_migration = true

[padding]
enabled = false

[[uplink_group]]
name = "main"
mode = "active_passive"
routing_scope = "global"
shared_resume = false
reselect_interval = "6h"
tun_wire_dial = true
health_weighted_selection = true
warm_standby_tcp = 1
warm_standby_udp = 1

[[outline.uplinks]]
name = "cloud1"
group = "main"
weight = 1.0
shuffle_wires = true
link = "vless://11111111-1111-4111-8111-111111111111@cloud1.beerloga.su:443?type=xhttp&mode=stream-one&security=tls&alpn=h3%2Ch2&path=%2FGLOBAL%2Fxhttp&encryption=none#cloud1:vless-only-vless-xhttp-stream-one"

