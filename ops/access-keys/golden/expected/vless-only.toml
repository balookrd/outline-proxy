# outline-ws-rust client config for the Android app.
# Generated for user vless-only — do not edit by hand.

[tun]
path = "vpn"
mtu = 1500

[tun.tcp]
sniffing = true
carrier_migration = true

[padding]
enabled = false

[[uplink_group]]
name = "main"
mode = "active_passive"
routing_scope = "global"
shared_resume = false
reselect_interval = "6h"
tun_wire_dial = true
health_weighted_selection = true
warm_standby_tcp = 1
warm_standby_udp = 1

[outline.probe]
interval_secs = 60
timeout_secs = 10
min_failures = 2
attempts = 1
endpoint_check = true
endpoint_check_timeout_ms = 2000

[outline.probe.dns]
server = "1.1.1.1"
port = 53
name = "google.com"

[outline.probe.tls]
targets = [
  "www.instagram.com",
  "www.youtube.com",
  "www.googletagmanager.com",
  "www.googlevideo.com",
  "api.telegram.org",
]

[[outline.uplinks]]
name = "cloud1"
group = "main"
weight = 1.0
shuffle_wires = true
shuffle_timer = "44m"
link = "vless://11111111-1111-4111-8111-111111111111@cloud1.beerloga.su:443?type=xhttp&mode=stream-one&security=tls&alpn=h3%2Ch2&path=%2FGLOBAL%2Fxhttp&encryption=none#cloud1:vless-only-vless-xhttp-stream-one"

  [[outline.uplinks.fallbacks]]
  link = "vless://11111111-1111-4111-8111-111111111111@cloud1.beerloga.su:443?type=ws&security=tls&alpn=h3%2Ch2%2Chttp%2F1.1&path=%2FGLOBAL%2Fvless&encryption=none#cloud1:vless-only-vless-ws"

  [[outline.uplinks.fallbacks]]
  link = "vless://11111111-1111-4111-8111-111111111111@cloud1.beerloga.su:443?type=xhttp&mode=packet-up&security=tls&alpn=h3%2Ch2%2Chttp%2F1.1&path=%2FGLOBAL%2Fxhttp&encryption=none#cloud1:vless-only-vless-xhttp-packet-up"

[[outline.uplinks]]
name = "cloud2"
group = "main"
weight = 1.0
shuffle_wires = true
shuffle_timer = "47m"
link = "vless://11111111-1111-4111-8111-111111111111@cloud2.beerloga.su:443?type=xhttp&mode=stream-one&security=tls&alpn=h3%2Ch2&path=%2FGLOBAL%2Fxhttp&encryption=none#cloud2:vless-only-vless-xhttp-stream-one"

  [[outline.uplinks.fallbacks]]
  link = "vless://11111111-1111-4111-8111-111111111111@cloud2.beerloga.su:443?type=ws&security=tls&alpn=h3%2Ch2%2Chttp%2F1.1&path=%2FGLOBAL%2Fvless&encryption=none#cloud2:vless-only-vless-ws"

  [[outline.uplinks.fallbacks]]
  link = "vless://11111111-1111-4111-8111-111111111111@cloud2.beerloga.su:443?type=xhttp&mode=packet-up&security=tls&alpn=h3%2Ch2%2Chttp%2F1.1&path=%2FGLOBAL%2Fxhttp&encryption=none#cloud2:vless-only-vless-xhttp-packet-up"
