# outline-ws-rust client config for the Android app.
# Generated for user both — do not edit by hand.

[tun]
path = "vpn"
mtu = 1500

[tun.tcp]
sniffing = true
carrier_migration = true

[padding]
enabled = false

[[uplink_group]]
