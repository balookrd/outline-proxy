# Forwarded zones for an entry node. Owned by
# ops/provision-node/assets/unbound/forward-zones.entry.conf — install.sh writes
# this file to /opt/unbound/forward-zones.conf, which unbound.conf includes, so
# edit it here rather than on a node. The exit family gets
# forward-zones.exit.conf at the same path instead.
#
# Every zone here loses local recursion and gains a third party, so keep the
# list minimal. The upstreams are DoT and are verified against the CA bundle
# named by tls-cert-bundle in unbound.conf. An upstream whose certificate has
# expired is not "slow": unbound drops the handshake, marks the host dead for
# infra-host-ttl and the zone answers SERVFAIL for the whole fleet — that was
# google.com on 2026-11-05.

# --- Geo-blocked origins ----------------------------------------------------
# TMDB and its image CDN (Bunny, b-cdn.net) answer 127.0.0.1 to any recursion
# that reaches them from a Russian address. Verified 2026-08-23: asking
# ns1..ns3.bunnydns.com directly from cloud1 (176.123.167.42) returns
# 127.0.0.1, the same question from nuxt (185.78.76.246) returns real CDN
# addresses, and DoH to 1.1.1.1 / 8.8.8.8 — a channel nothing on the path can
# tamper with — still returns 127.0.0.1 from cloud1. So this is the origin's
# own geo-block, not an ISP hijack: DNSSEC, TCP fallback or an encrypted
# upstream change nothing, only where the recursion physically happens does.
# HTTP is not blocked — given a correct A record both image.tmdb.org and
# api.themoviedb.org answer fine straight from a Russian IP, so only the
# lookup has to leave the country.
forward-zone:
    name: "tmdb.org."
    forward-tls-upstream: yes
    forward-addr: 9.9.9.9@853#dns.quad9.net
    forward-addr: 149.112.112.112@853#dns.quad9.net
    forward-addr: 194.242.2.2@853#dns.mullvad.net

forward-zone:
    name: "themoviedb.org."
    forward-tls-upstream: yes
    forward-addr: 9.9.9.9@853#dns.quad9.net
    forward-addr: 149.112.112.112@853#dns.quad9.net
    forward-addr: 194.242.2.2@853#dns.mullvad.net

forward-zone:
    name: "b-cdn.net."
    forward-tls-upstream: yes
    forward-addr: 9.9.9.9@853#dns.quad9.net
    forward-addr: 149.112.112.112@853#dns.quad9.net
    forward-addr: 194.242.2.2@853#dns.mullvad.net

# --- Google, resolved from abroad --------------------------------------------
# google.com and googleapis.com are forwarded to the fleet's own exit nodes
# rather than to a public resolver: Google hands out addresses by where the
# recursion comes from, and the exit nodes are where the traffic leaves anyway.
# The upstreams are the dnsproxy DoT listeners on nuxt/nuxt2 (:8853, the
# node's own Let's Encrypt certificate, see docker-compose.exit.yml), so the
# exit family MUST run dnsproxy and MUST restart it after each renewal
# (dnsproxy-cert-reload.sh). Only live exit nodes belong here: a dead or
# decommissioned one costs a timeout on every cold lookup of the zone until
# unbound marks it down. This block is entry-only on purpose — on an exit node
# it would forward the zone to the node itself and loop.
forward-zone:
    name: "google.com."
    forward-tls-upstream: yes
    forward-addr: 185.78.76.246@8853#nuxt.beerloga.su
    forward-addr: 77.91.78.220@8853#nuxt2.beerloga.su

forward-zone:
    name: "googleapis.com."
    forward-tls-upstream: yes
    forward-addr: 185.78.76.246@8853#nuxt.beerloga.su
    forward-addr: 77.91.78.220@8853#nuxt2.beerloga.su
