# Recursive resolver for a fleet node. Owned by
# ops/provision-node/assets/unbound/unbound.conf — install.sh writes this file
# verbatim, so edit it here rather than on a node.
#
# Mounted read-only into the klutchell/unbound container, which runs with
# `network_mode: host`, so `interface: 127.0.0.1` is the host's loopback.
#
# On an entry node dnsproxy fronts this on :853/:443 for the fleet; on an exit
# node nothing does and the resolver serves only the node itself.
#
# Apply an edit with `docker restart unbound`, never `unbound-control reload`:
# the image runs with chroot: /var/unbound, so a reload re-reads the config
# from inside the chroot, dies with "Could not open /etc/unbound/unbound.conf"
# and leaves the daemon serving the OLD config with its remote-control socket
# gone -- after which unbound-control reports "unbound is stopped" while the
# resolver is in fact still answering. Learned the hard way on cloud1
# 2026-08-23. A restart costs a sub-second resolution gap.

server:
    interface: 127.0.0.1
    interface: ::1
    port: 53

    access-control: 0.0.0.0/0 allow
    access-control: ::/0 allow

    do-ip4: yes
    do-ip6: yes
    do-udp: yes
    do-tcp: yes

    verbosity: 1
    # 13 of the 21 panels in the Unbound dashboard (uid 9FQf4fEWz, see
    # ops/grafana/README.md) are empty without this. `unbound-control
    # stats_noreset` returns 93 lines of basic counters on its own and 195 with
    # it, which is the difference between 27 and 56 unbound_* metric families:
    # num.query.type.*, num.answer.rcode.*, mem.*, msg.cache.count,
    # rrset.cache.count, unwanted.* and num.query.aggressive.* exist only here.
    # statistics-cumulative is deliberately not set: the exporter polls
    # stats_noreset, so the counters already rise monotonically downstream.
    extended-statistics: yes
    use-syslog: no
    logfile: ""

    num-threads: 2
    so-reuseport: yes

    msg-cache-size: 64m
    rrset-cache-size: 128m
    infra-cache-numhosts: 20000
    key-cache-size: 32m

    cache-min-ttl: 300
    cache-max-ttl: 3600
    # Without this an NXDOMAIN sticks for cache-max-ttl, i.e. an hour: a name
    # that starts resolving stays broken for the whole fleet long after the
    # authoritative side is fixed.
    cache-max-negative-ttl: 60
    neg-cache-size: 8m

    prefetch: yes
    prefetch-key: yes
    serve-expired: yes
    serve-expired-ttl: 3600
    serve-expired-client-timeout: 1000

    edns-buffer-size: 1232
    outgoing-range: 8192
    num-queries-per-thread: 4096
    jostle-timeout: 200

    harden-glue: yes
    harden-dnssec-stripped: yes
    qname-minimisation: yes

    # Required for the forward-zone blocks below: unbound verifies DoT
    # upstreams against this bundle and has no default path for it, so without
    # the line every TLS handshake dies with "unable to get local issuer
    # certificate" and the forwarded zones simply time out. The path is inside
    # the klutchell/unbound image.
    tls-cert-bundle: "/etc/ssl/certs/ca-certificates.crt"

    hide-identity: yes
    hide-version: yes

# unbound_exporter reads its statistics over this channel and has no other
# source: with control-enable set to no the exporter starts, stays up and
# exports nothing, which is how nuxt/nuxt2 ended up with no unbound metrics at
# all until 2026-08-08. control-use-cert: no because the port is loopback-only
# and the exporter is launched with empty --unbound.ca/cert/key to match.
remote-control:
    control-enable: yes
    control-interface: 127.0.0.1
    control-port: 8953
    control-use-cert: no

# --- Geo-blocked origins ----------------------------------------------------
# TMDB and its image CDN (Bunny, b-cdn.net) answer 127.0.0.1 to any recursion
# that reaches them from a Russian address. Verified 2026-08-23: asking
# ns1..ns3.bunnydns.com directly from cloud1 (176.123.167.42) returns
# 127.0.0.1, the same question from nuxt (185.78.76.246) returns real CDN
# addresses, and DoH to 1.1.1.1 / 8.8.8.8 — a channel nothing on the path can
# tamper with — still returns 127.0.0.1 from cloud1. So this is the origin's
# own geo-block, not an ISP hijack: DNSSEC, TCP fallback or an encrypted
# upstream change nothing, only where the recursion physically happens does.
# HTTP is not blocked — given a correct A record both image.tmdb.org and
# api.themoviedb.org answer fine straight from a Russian IP, so only the
# lookup has to leave the country.
#
# Entry nodes therefore forward just these zones to resolvers that recurse
# from outside Russia; on exit nodes the block is a no-op. Keep the list
# minimal: every zone here loses local recursion and gains a third party.
forward-zone:
    name: "tmdb.org."
    forward-tls-upstream: yes
    forward-addr: 9.9.9.9@853#dns.quad9.net
    forward-addr: 149.112.112.112@853#dns.quad9.net
    forward-addr: 194.242.2.2@853#dns.mullvad.net

forward-zone:
    name: "themoviedb.org."
    forward-tls-upstream: yes
    forward-addr: 9.9.9.9@853#dns.quad9.net
    forward-addr: 149.112.112.112@853#dns.quad9.net
    forward-addr: 194.242.2.2@853#dns.mullvad.net

forward-zone:
    name: "b-cdn.net."
    forward-tls-upstream: yes
    forward-addr: 9.9.9.9@853#dns.quad9.net
    forward-addr: 149.112.112.112@853#dns.quad9.net
    forward-addr: 194.242.2.2@853#dns.mullvad.net
