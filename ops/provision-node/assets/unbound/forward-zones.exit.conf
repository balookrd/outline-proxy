# Forwarded zones for an exit node. Owned by
# ops/provision-node/assets/unbound/forward-zones.exit.conf — install.sh writes
# this file to /opt/unbound/forward-zones.conf, which unbound.conf includes, so
# edit it here rather than on a node. The entry family gets
# forward-zones.entry.conf at the same path instead.
#
# Deliberately empty: an exit node recurses from outside Russia, so none of the
# geo-blocked zones the entry family forwards need special handling here, and
# the google.com/googleapis.com forward that cloud1/cloud2 point at THIS node's
# dnsproxy would loop if it were present. unbound requires the included file
# to exist, which is why an empty one is installed rather than none.
