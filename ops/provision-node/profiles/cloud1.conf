# shellcheck shell=bash
# Every variable here is consumed by collect-from-reference.sh or install.sh,
# which source this file — shellcheck cannot see across that boundary.
# shellcheck disable=SC2034
#
# Profile: entry node (cloud1 family).
#
# Serves clients on 443, dials the fleet through outline-ws-rust, and carries
# ocserv, unbound+dnsproxy and the DDNS responder. netplan-managed network,
# IPv4 only.
#
# Sourced by collect-from-reference.sh on the workstation and again by
# install.sh on the target — collect copies this file into the bundle, so the
# bundle stays self-describing.

PROFILE_DESCRIPTION="entry node: ss+ws, ocserv, unbound/dnsproxy, ddns container"

# ---------------------------------------------------------------- collection

# Paths are relative to / so the archives unroll with `tar -C /`.
OPT_PATHS=(
    opt/network opt/outline opt/ddns opt/unbound opt/ocserv
    opt/metrics.sh opt/ipv4.sh opt/ipv6.sh
)

# Dormant subsystems, superseded copies and regenerable state stay behind.
#
# The two unbound files are excluded because the repo owns them (ASSET_FILES
# below), not because they are dormant: collecting them would put the
# reference's copy in the bundle for the asset to overwrite a moment later, and
# a bundle that carries both is a bundle where it is unclear which one won.
OPT_EXCLUDES='*.bak*,*-old.sh,*.old,*.orig,*.new,__pycache__,opt/ddns/venv,opt/ddns.venv-backup*,opt/ddns/certs/*.pem,opt/outline/outline-ss-rust/users.txt,opt/ocserv/conf/ocpasswd,opt/ocserv/conf/certs,opt/unbound/docker-compose.yml,opt/unbound/unbound.conf'

BIN_PATHS=(
    usr/local/bin/outline-ss-rust usr/local/bin/outline-ws-rust
    usr/local/sbin/outline-watchdog usr/local/sbin/zram-swap
)

UNIT_PATHS=(
    etc/systemd/system/outline-ss-rust.service
    etc/systemd/system/outline-ss-rust.service.d
    etc/systemd/system/outline-ws-rust.service
    etc/systemd/system/outline-ws-rust.service.d
    etc/systemd/system/outline-ws-rust@.service
    etc/systemd/system/outline-watchdog@.service
    etc/systemd/system/outline-watchdog@.timer
    etc/systemd/system/ocserv-exporter.service
    etc/systemd/system/zram-swap.service
)

ETC_NGINX_PATHS=( etc/nginx/nginx.conf etc/nginx/sites-available/beerloga.su )
ETC_SYSCTL_PATHS=(
    etc/sysctl.d/shadowsocks.conf etc/sysctl.d/10-bufferbloat.conf
    etc/sysctl.d/99-forwarding.conf
)
ETC_DOCKER_PATHS=( etc/docker/daemon.json )

# Reference material only — install.sh never applies these (see the network
# phase). netplan renders from cloud-init here, so it is informational.
NETWORK_PATHS=( etc/netplan )

# Secret archives: <bundle-name>:<space-separated paths>
SECRET_TARS=(
    "etc-outline:etc/outline-ss-rust/config.toml etc/outline-ws-rust/config.toml etc/outline-ws-rust/domains-main.list etc/outline-ws-rust/domains-russia.list"
    "opt-beerloga:opt/beerloga"
)
# The reference's own host certificate is left behind — the new node issues its
# own. %REF_HOST% expands to the reference's short hostname.
SECRET_TAR_EXCLUDES="opt/beerloga/.lego/certificates/%REF_HOST%.*,*.bak*"

# Single secret files: <remote-path>:<bundle-name>[:optional]
SECRET_FILES=(
    "/opt/outline/outline-ss-rust/users.txt:users.txt"
    "/opt/ocserv/conf/ocpasswd:ocserv-ocpasswd:optional"
)

# Containers to regenerate a run script for, because no compose file describes
# them and the checked-in script on disk has drifted from what actually runs.
DOCKER_RUN_SCRIPTS=( "ocserv:/opt/ocserv/ocserv-run.sh" )

PACKAGES_ALLOW_RE='^(nginx|docker-ce|docker-ce-cli|containerd\.io|docker-buildx-plugin|docker-compose-plugin|apt-transport-https|net-tools|mc|curl|jq|ipset|gawk|dnsutils)$'
# dnsutils is what the verify phase asks this node's own resolver with.
PACKAGES_FORCE=( jq ipset gawk curl dnsutils )

# ------------------------------------------------------------- installation

# Files naming the reference host, rewritten to the new one. The last two carry
# the name only in a comment, but a node describing itself as another one is how
# an operator reads the wrong host's state during an incident.
# /opt/unbound/docker-compose.yml is not here any more: it is written from
# assets/unbound/docker-compose.entry.yml with %DOMAIN% already expanded, so it
# never carries the reference's name to begin with. The rehost audit still reads
# it — COMPOSE_REQUIRED_ARGS names it — so a stray mention would still be caught.
REHOST_FILES=(
    /opt/beerloga/update-certs.sh
    /opt/ddns/certs/make_links.sh
    /etc/outline-ss-rust/config.toml
    /etc/systemd/system/zram-swap.service
    /usr/local/sbin/zram-swap
    /opt/network/iptables-init.sh
)

# The unbound stack comes from the repo rather than from the reference: three
# containers and a resolver config that are identical on every node of this
# family, and that drifted apart on the live ones exactly because nothing but
# the reference described them. The entry variant adds dnsproxy, which is what
# serves DoT/DoH to the fleet; its certificate paths carry %DOMAIN%, expanded to
# this node's own FQDN when the asset is written.
ASSET_FILES=(
    "unbound/docker-compose.entry.yml:/opt/unbound/docker-compose.yml:0644"
    "unbound/unbound.conf:/opt/unbound/unbound.conf:0644"
)

# The exporter binds 127.0.0.1:9167; this is how the scrape on .102 reaches it.
NGINX_LOCATIONS=( "/unbound-exporter/metrics:http://127.0.0.1:9167/metrics" )

# Now an assertion rather than a repair: the asset above already carries the
# flag, so this only ever fires if someone drops it there — and it says so out
# loud when it does. dnsproxy resolves from hosts files by default and
# `network_mode: host` gives it a copy of this node's /etc/hosts, so without the
# flag it answers `<node>.beerloga.su → 127.0.1.1` for its own name to everyone
# using it as a resolver (2026-08-08: the dashboard on .102 hit its own port 443
# and reported cloud2 offline with a TLS alert).
COMPOSE_REQUIRED_ARGS=(
    "/opt/unbound/docker-compose.yml:dnsproxy:--hosts-file-enabled=false"
)

# This family serves DNS to the fleet, so verify asks it for its own name.
VERIFY_SELF_DNS=1

# ddns runs from a container image, same as the exit nodes: the virtualenv it
# used to need cannot even be built on a node where pypi.org is unreachable,
# and the container binds 127.0.0.1:8008 — the port nginx already proxies
# /update to, and not the internet-facing *:8009 the unit used to hold open.
# Generated post-up.service, replacing the hand-written one the reference
# carried. Same shape as the exit profile: the firewall first, then the mark
# classifier, which sources init-ws0.sh to create the tun device the client
# needs — hence Before=outline-ws-rust.service. All three scripts are
# re-runnable, so a restart of the unit changes nothing.
NET_BRINGUP_EXEC=(
    "/opt/network/iptables-init.sh"
    "/opt/network/tunnel-init.sh"
)
NET_BRINGUP_BEFORE="outline-ws-rust.service"

DDNS_MODE="docker"
DDNS_BUILD="cd /opt/ddns && ./build-image.sh"
# Skip the build when this image is already loaded: a node that cannot
# reach pypi.org gets it via `docker save | docker load` instead.
DDNS_IMAGE="update_domain"
DDNS_START="/opt/ddns/update_domain.sh"

ENABLE_UNITS=(
    zram-swap.service post-up.service
    outline-ss-rust.service outline-ws-rust.service
    outline-watchdog@outline-ss-rust.timer outline-watchdog@outline-ws-rust.timer
    ocserv-exporter.service nginx.service
)
# Units installed but deliberately left disabled.
INSTALL_ONLY_UNITS=()

# Run in order, after the images are pulled.
DOCKER_START=(
    "/opt/metrics.sh"
    "/opt/ocserv/ocserv-run.sh"
    "cd /opt/unbound && docker compose up -d --force-recreate"
)

ACCESS_KEYS_REGEN=1
NGINX_SITE="beerloga.su"
OCCTL_SYMLINK=1

VERIFY_UNITS=(
    outline-ss-rust outline-ws-rust nginx ocserv-exporter
    zram-swap post-up docker cron
)
VERIFY_TIMERS=(
    outline-watchdog@outline-ss-rust.timer outline-watchdog@outline-ws-rust.timer
)
VERIFY_METRICS=(
    "127.0.0.1:9090/metrics ss-rust" "127.0.0.1:9091/metrics ws-rust"
    "127.0.0.1:9167/metrics unbound-exporter"
)
VERIFY_PORTS=( 443 4443 80 53 8443 8853 9100 )

# This family dials peers through outline-ws-rust, so the install refuses to
# proceed without either per-node credentials or an explicit opt-out.
REQUIRES_UPLINK_CREDS=1
# DNS-01 through reg.ru: no web server needed at issue time.
CERT_NEEDS_WEBROOT=0
IPV6=0
