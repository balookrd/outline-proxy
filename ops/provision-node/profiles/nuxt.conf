# shellcheck shell=bash
# Every variable here is consumed by collect-from-reference.sh or install.sh,
# which source this file — shellcheck cannot see across that boundary.
# shellcheck disable=SC2034
#
# Profile: exit node (nuxt family).
#
# Terminates client tunnels on 443 and exits to the internet. Fewer moving
# parts than the entry profile — no ocserv, no dnsproxy, no per-node uplinks —
# but it is dual-stack: a routed IPv6 /64 with ndppd answering neighbour
# solicitations for it.
#
# Two things on the reference are deliberately out of scope for a clone:
#
#   xray       the reference still runs it beside outline-ss-rust; a new node
#              does not, so neither the binary, the units, the exporter nor its
#              config (which carries VLESS ids) is collected.
#   GRE/BGP    bgp0/bgp1 are GRE tunnels to fixed peers, defined in the
#              reference's /etc/network/interfaces. A clone gets no tunnels, so
#              no network configuration is collected at all — only ndppd.conf,
#              which is a daemon config rather than an interface definition.
#
# outline-ws-rust ships installed-but-disabled: the unit and its (unpopulated)
# config travel with the node so it can be turned into a client later, but
# nothing starts it.
#
# ACME here is HTTP-01 through the nginx webroot, not the DNS-01 flow the entry
# profile uses, and it renews two names: the node's own and the shared sp.*
# certificate dumbproxy serves.

PROFILE_DESCRIPTION="exit node: ss-rust, xray, dumbproxy, unbound, ddns container, IPv6+ndppd"

# ---------------------------------------------------------------- collection

OPT_PATHS=(
    opt/network opt/outline opt/ddns opt/unbound opt/dumbproxy
    opt/metrics.sh
)

# Dormant on the reference and not carried over: adguardhome, dnsmasq+stubby,
# envoy, mtproto, ocserv scripts, the ss-local/ss-server predecessors.
#
# The two unbound files are excluded because the repo owns them (ASSET_FILES
# below), not because they are dormant: collecting them would put the
# reference's copy in the bundle for the asset to overwrite a moment later, and
# a bundle that carries both is a bundle where it is unclear which one won.
OPT_EXCLUDES='*.bak*,*-old.sh,*.old,*.orig,*.new,__pycache__,opt/outline/ss-local,opt/outline/ss-server,opt/outline/outline-ss-rust/users.txt,opt/dumbproxy/dumbproxy,opt/dumbproxy/dumbproxy.orig,opt/ddns/certs/*.pem,opt/unbound/docker-compose.yml,opt/unbound/unbound.conf'

BIN_PATHS=(
    usr/local/bin/outline-ss-rust usr/local/bin/outline-ws-rust
    usr/local/sbin/outline-watchdog usr/local/sbin/zram-swap
)

UNIT_PATHS=(
    etc/systemd/system/outline-ss-rust.service
    etc/systemd/system/outline-ss-rust.service.d
    etc/systemd/system/outline-ws-rust.service
    etc/systemd/system/outline-ws-rust@.service
    etc/systemd/system/outline-watchdog@.service
    etc/systemd/system/outline-watchdog@.timer
    etc/systemd/system/zram-swap.service
)

ETC_NGINX_PATHS=( etc/nginx/nginx.conf etc/nginx/sites-available/beerloga.su )
ETC_SYSCTL_PATHS=(
    etc/sysctl.d/shadowsocks.conf etc/sysctl.d/10-bufferbloat.conf
    etc/sysctl.d/99-forwarding.conf
)
ETC_DOCKER_PATHS=( etc/docker/daemon.json )

# No network configuration travels with this profile: the reference's
# /etc/network/interfaces defines its own addresses and the GRE tunnels a clone
# does not want. The new node's interfaces are set up before install runs.
#
# But two of that file's hooks are not about addressing and must survive the
# move (see NET_BRINGUP_EXEC below): the post-up that builds the firewall, and
# the local route that makes the whole /64 land on this host.
NETWORK_PATHS=()

# ndppd.conf is a daemon config rather than an interface definition — installing
# it is safe, and the daemon is useless without it. Its /64 is rewritten by
# --ipv6-prefix (see REHOST_IPV6_FILES).
ETC_EXTRA_PATHS=( etc/ndppd.conf )

SECRET_TARS=(
    "etc-outline:etc/outline-ss-rust/config.toml"
    "opt-beerloga:opt/beerloga"
)
SECRET_TAR_EXCLUDES="opt/beerloga/.lego/certificates/%REF_HOST%.*,*.bak*"

SECRET_FILES=(
    "/opt/outline/outline-ss-rust/users.txt:users.txt"
)

# Every container here is created by a script in /opt, so nothing needs to be
# reverse-engineered from a running container.
DOCKER_RUN_SCRIPTS=()

# The image list is built from the reference's running containers; xray's
# exporter runs there but has no counterpart on a clone.
DOCKER_IMAGE_EXCLUDE_RE='xray-exporter'

PACKAGES_ALLOW_RE='^(nginx|docker-ce|docker-ce-cli|containerd\.io|docker-buildx-plugin|docker-compose-plugin|apt-transport-https|net-tools|mc|curl|jq|ipset|gawk|ndppd|sshguard|chrony|dnsutils)$'
# dnsutils is what the verify phase asks this node's own resolver with.
PACKAGES_FORCE=( jq ipset gawk curl ndppd dnsutils )

# ------------------------------------------------------------- installation

REHOST_FILES=(
    /opt/beerloga/update-certs.sh
    /opt/ddns/certs/make_links.sh
    /etc/outline-ss-rust/config.toml
    /etc/systemd/system/zram-swap.service
    /usr/local/sbin/zram-swap
)

# The unbound stack comes from the repo rather than from the reference: two
# containers and a resolver config that are identical on every node of this
# family, and that drifted apart on the live ones exactly because nothing but
# the reference described them. The exit variant is unbound + unbound-exporter;
# no dnsproxy, since nothing outside this node uses the resolver.
ASSET_FILES=(
    "unbound/docker-compose.exit.yml:/opt/unbound/docker-compose.yml:0644"
    "unbound/unbound.conf:/opt/unbound/unbound.conf:0644"
)

# The exporter binds 127.0.0.1:9167; this is how the scrape on .102 reaches it.
NGINX_LOCATIONS=( "/unbound-exporter/metrics:http://127.0.0.1:9167/metrics" )

# unbound here listens on loopback only and no dnsproxy fronts it, so the
# hosts-file leak the entry profile guards against cannot reach the network.
# The self-check still runs: it is cheap and it catches a resolver that names
# this node after the reference.
VERIFY_SELF_DNS=1

# iptables-init.sh derives the WAN interface, address and /64 at run time
# (2026-08-07), so nothing in it names the reference and no rehost pass is
# needed for it.
#
# iptables-update.sh is deliberately NOT rehosted: the addresses in it are the
# mesh peer list on port 9443, identical on every edge node so the same file can
# be rolled out everywhere. Rewriting them per node would quietly break the
# mesh. Adding a new node to that list is a fleet-wide edit, not part of an
# install — see the README.
#
# The keys stay available for a reference that still hardcodes its own identity:
#   REHOST_IFACE_FILES=( ... )
#   REHOST_IPV4_FILES=( ... )

# Replaces the ifupdown hooks the reference keeps in /etc/network/interfaces:
#   post-up /opt/network/ipset-init.sh   → ipsets, then iptables-init.sh, which
#                                          sources iptables-update.sh (the whole
#                                          firewall, incl. v4/v6 MASQUERADE)
#   up ip -6 route add local <prefix> lo → accept the entire routed /64 locally
# `route replace` rather than `add`, so re-running the unit is harmless.
NET_BRINGUP_EXEC=(
    "/opt/network/ipset-init.sh"
    "/usr/sbin/ip -6 route replace local %IPV6_PREFIX% dev lo"
)
NET_BRINGUP_EXEC_STOP=( "/usr/sbin/ip -6 route del local %IPV6_PREFIX% dev lo" )
NET_BRINGUP_BEFORE="outline-ss-rust.service"

# ddns runs as a locally built container image, not a virtualenv.
DDNS_MODE="docker"
DDNS_BUILD="cd /opt/ddns && ./build-image.sh"
# Skip the build when this image is already loaded: a node that cannot
# reach pypi.org gets it via `docker save | docker load` instead.
DDNS_IMAGE="update_domain"
DDNS_START="/opt/ddns/update_domain.sh"

ENABLE_UNITS=(
    zram-swap.service
    post-up.service
    outline-ss-rust.service
    outline-watchdog@outline-ss-rust.timer
    nginx.service
    ndppd.service
)
# Present but not started: this is an exit node today.
INSTALL_ONLY_UNITS=( outline-ws-rust.service )

DOCKER_START=(
    "/opt/metrics.sh"
    "/opt/dumbproxy/dumbproxy.sh"
    "cd /opt/unbound && docker compose up -d --force-recreate"
)

ACCESS_KEYS_REGEN=1
NGINX_SITE="beerloga.su"
OCCTL_SYMLINK=0

# Certificates the node renews. %HOST% expands to --host, so a clone issues its
# own name and shares the sp.* service certificate.
CERT_DOMAINS=( "%HOST%.beerloga.su" "sp.beerloga.su" )

# update-certs.sh (cron, daily) only renews; a brand-new node has nothing to
# renew, so the first certificate is issued with `run`. HTTP-01 through the same
# nginx webroot, %EMAIL% taken from update-certs.sh on the target.
# lego 5 moved -a/--email/--domains/--http into the `run` subcommand; the
# reference still runs a locally cached 4.x image, where they were global flags.
# A fresh node always pulls latest, so the 5.x form is the right one here.
CERT_ISSUE_CMD='docker run --rm --net host -v /opt/beerloga/.lego:/.lego -v /var/www/html:/html goacme/lego run -a --email="%EMAIL%" --domains="%DOMAIN%" --http --http.webroot /html'

VERIFY_UNITS=( outline-ss-rust nginx docker cron post-up )
VERIFY_TIMERS=( outline-watchdog@outline-ss-rust.timer )
VERIFY_METRICS=( "127.0.0.1:9090/metrics ss-rust" "127.0.0.1:9167/metrics unbound-exporter" )
VERIFY_PORTS=( 443 80 53 9100 10443 )

# Dual-stack node: the verify phase checks that IPv6 default routing and the NDP
# proxy are in place, and rehost rewrites the /64 when --ipv6-prefix is given.
IPV6=1
# ndppd answers NS for the /64; ss-rust picks random outbound source addresses
# out of it ([outbound] ipv6_prefix). Left at the reference's value, the server
# would probe addresses it does not own, fail, and silently fall back to the
# kernel default source.
REHOST_IPV6_FILES=( /etc/ndppd.conf /etc/outline-ss-rust/config.toml )

# Exit node: no uplinks of its own.
REQUIRES_UPLINK_CREDS=0
# HTTP-01 through the nginx webroot — nginx must be up before lego runs.
CERT_NEEDS_WEBROOT=1
