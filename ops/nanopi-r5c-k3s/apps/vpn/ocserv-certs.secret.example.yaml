# Template — NOT applied by deploy.sh (*.example.yaml is skipped).
# Create the real secret from cert files, keep them out of git:
#
#   kubectl -n vpn create secret generic ocserv-certs \
#     --from-file=server-cert.pem \
#     --from-file=server-key.pem \
#     --from-file=ca.pem
apiVersion: v1
kind: Secret
metadata:
  name: ocserv-certs
  namespace: vpn
type: Opaque
stringData:
  server-cert.pem: "CHANGE_ME"
  server-key.pem:  "CHANGE_ME"
  ca.pem:          "CHANGE_ME"
