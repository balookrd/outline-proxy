# Helm values for Traefik (traefik/traefik chart 41.x, Traefik v3.7).
# Install:
#   helm install traefik traefik/traefik -n traefik --create-namespace \
#     -f traefik.values.yaml
#
# LAN-only, HTTPS. The wildcard certificate for *.k3s.beerloga.su comes from
# lego on 198.18.1.102 via the `default` TLSStore (tls-store.yaml); there is no
# cert-manager and no ACME resolver configured here.
#
# The chart validates values against a JSON schema — keys that look plausible
# but are not in `helm show values traefik/traefik` (logs, ports.web.redirectTo,
# ports.websecure.tls) are rejected at install time. Check the schema before
# adding anything here.

deployment:
  # Replicas on different nodes. With one replica, losing its node (k3s-2
  # loses power now and then) took every *.k3s name down for ~6 minutes: MetalLB
  # moves the VIP in seconds, but the only Traefik endpoint sits on the dead
  # node until the 300 s not-ready/unreachable toleration evicts the pod. With a
  # replica elsewhere the dead endpoint is dropped once the node turns
  # NotReady (~40-50 s), and the other pod keeps serving meanwhile.
  # Three replicas = one per node: with externalTrafficPolicy Local (below)
  # MetalLB can announce the VIP from any node, and draining one node still
  # leaves two endpoints.
  replicas: 3

# Hard spread: never two replicas on one node, or a single node loss takes out
# two endpoints at once.
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: traefik
            app.kubernetes.io/instance: traefik-traefik
        topologyKey: kubernetes.io/hostname

# Keeps `kubectl drain` and the descheduler to one replica at a time.
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# Replace in place, one pod at a time. With 3 replicas on 3 nodes and the
# required anti-affinity above, the chart default (maxSurge 1, maxUnavailable 0)
# would create a 4th pod that has no node to go to — the rollout would hang.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

service:
  type: LoadBalancer
  annotations:
    metallb.universe.tf/loadBalancerIPs: 198.18.1.200
  # Local: MetalLB (L2) announces the VIP only from a node running a ready
  # Traefik pod, and kube-proxy delivers to that local pod only. With Cluster,
  # any node could hold the VIP and kube-proxy spread connections across both
  # pods, so after a node loss about half of new connections were DNATed to the
  # dead pod until the node turned NotReady (~40-50 s). With Local the only
  # outage is the VIP failover when the announcing node itself dies. Side
  # effect: Traefik sees real client IPs instead of SNATed node addresses.
  spec:
    externalTrafficPolicy: Local

ports:
  web:
    port: 8000
    exposedPort: 80        # LAN clients hit :80 on 198.18.1.200
    expose:
      default: true
    http:
      redirections:
        entryPoint:
          to: websecure    # plain HTTP always bounces to TLS
          scheme: https
          permanent: true
  websecure:
    port: 8443
    exposedPort: 443
    expose:
      default: true
    http:
      tls:
        enabled: true      # certificate comes from the default TLSStore
  traefik:
    expose:
      default: false       # dashboard/API stays internal (port-forward to view)

providers:
  kubernetesIngress:
    enabled: true          # watch standard Ingress objects
  kubernetesCRD:
    enabled: true          # IngressRoute + TLSStore CRDs

# 4 GB nodes — keep Traefik lean.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 192Mi

log:
  level: INFO

accessLog:
  enabled: false           # turn on only when debugging routing
