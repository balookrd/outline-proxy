# HTTP ingress objects. All resolve to the Traefik VIP 198.18.1.200; Traefik
# routes by Host header. Point *.k3s.beerloga.su at 198.18.1.200 in DNS (see
# README) — LAN-only, no public record.
#
# TLS: no per-Ingress secretName here on purpose. The wildcard certificate is
# served by the `default` TLSStore (tls-store.yaml), so the Secret lives once in
# the traefik namespace instead of being copied into monitoring/home.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zigbee2mqtt
  namespace: home
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: z2m.k3s.beerloga.su
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: zigbee2mqtt
                port:
                  number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: outline-ui
  namespace: monitoring
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: ui.k3s.beerloga.su
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: outline-ui
                port:
                  number: 9000
---
# vmalert and Alertmanager stay in k3s after VictoriaMetrics and Grafana moved
# to the NAS (ops/nas-monitoring). The NAS scrapes their /metrics and Grafana
# reads Alertmanager through these names. LAN-only, like every *.k3s name;
# Alertmanager has no auth, so anyone on the LAN can create a silence.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vmalert
  namespace: monitoring
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: vmalert.k3s.beerloga.su
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vmalert
                port:
                  number: 8880
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alertmanager
  namespace: monitoring
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: alertmanager.k3s.beerloga.su
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: alertmanager
                port:
                  number: 9093
---
# Per-replica /metrics for the NAS scrape (ops/nas-monitoring scrape.yaml, job
# alertmanager): the load-balanced name above would hit a random peer on every
# scrape. Only /metrics is routed — the API and UI stay on alertmanager.k3s.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alertmanager-replicas
  namespace: monitoring
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: alertmanager-0.k3s.beerloga.su
      http:
        paths:
          - path: /metrics
            pathType: Exact
            backend:
              service:
                name: alertmanager-0
                port:
                  number: 9093
    - host: alertmanager-1.k3s.beerloga.su
      http:
        paths:
          - path: /metrics
            pathType: Exact
            backend:
              service:
                name: alertmanager-1
                port:
                  number: 9093
    - host: alertmanager-2.k3s.beerloga.su
      http:
        paths:
          - path: /metrics
            pathType: Exact
            backend:
              service:
                name: alertmanager-2
                port:
                  number: 9093
