# zigbee2mqtt, migrated off the docker container on 198.18.1.102.
#
# The coordinator is a network adapter (tcp://198.18.1.106:8888), not a USB
# stick, so the pod is free to run on any node — no device passthrough, no
# nodeSelector.
#
# Data lives on NFS rather than local-path. z2m's database.db is a JSON-lines
# file, not SQLite: no locking, no page cache to corrupt, one writer. So the
# usual reason to avoid a network filesystem does not apply, and in exchange the
# pod stops being pinned to whichever node happened to hold the volume.
#
# Singleton, and not merely by convention: the coordinator accepts exactly one
# client. Two replicas would fight over the session, so replicas: 1 + Recreate.
#
# Settings live in configuration.yaml inside the volume, not in env: it is the
# single source of truth for the coordinator address, the MQTT broker
# (mqtt://mosquitto.home:1883) and, critically, network_key / pan_id /
# ext_pan_id. Duplicating half of it into env is how the two drift apart.
#
# Z2M_WATCHDOG is the one exception, because z2m reads it from env only — it has
# no configuration.yaml counterpart, so it duplicates nothing. The coordinator
# hangs off an Ebyte EBT3001 serial-to-Ethernet bridge, and every few hours ASH
# times out against it: z2m logs "Adapter disconnected, stopping" and exits(2).
# Without the watchdog that costs a container restart (31 in the 8 days to
# 2026-08-26) and truncates the log at exactly the interesting moment; with it,
# z2m reconnects in-process after 2s and the log survives the reconnect.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zigbee2mqtt
  namespace: home
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: zigbee2mqtt }
  template:
    metadata:
      labels: { app: zigbee2mqtt }
    spec:
      securityContext:
        runAsUser: 1000       # matches the image and the migrated files
        fsGroup: 1000
      # Reschedule ~1.7 min after a host dies (40s NotReady detect + 60s here),
      # not the 5-min default. Stateless single replica — safe to move fast; the
      # floor stays above a k3s restart / network blip so it does not churn.
      tolerations:
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
      containers:
        - name: zigbee2mqtt
          image: koenkk/zigbee2mqtt@sha256:1debff565ab6841417bd9f7ce8ad44f8c5f25a8b02a24ce3fd79e4779a4763a5 # 2.12.0
          ports:
            - { containerPort: 8080, name: frontend }
          env:
            # "default" = retry the adapter after 2s, then 1/5/15/30/60 min if it
            # keeps failing; the counter resets on every successful start.
            - { name: Z2M_WATCHDOG, value: "default" }
          volumeMounts:
            - { name: data, mountPath: /app/data }
          readinessProbe:
            # tcpSocket, not httpGet: the frontend answers / with a redirect.
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { memory: 384Mi }   # measured 102 MB in steady state
      volumes:
        - name: data
          nfs:
            server: 198.18.1.125
            path: /mnt/HD/HD_a2/k8s/zigbee2mqtt-data
---
apiVersion: v1
kind: Service
metadata:
  name: zigbee2mqtt
  namespace: home
spec:
  selector: { app: zigbee2mqtt }
  ports:
    - { port: 8080, targetPort: 8080 }
