# Jellyfin is not a k3s workload: it runs as the UGOS docker app on the UGREEN
# NAS 198.18.1.105 (host port 8899 -> container 8096). This file only gives it
# a name and TLS behind Traefik, the same way as every other *.k3s service.
#
# Why not a redirect on the NAS itself: ports 80/443 there belong to the UGOS
# nginx (it sends / to the admin UI on :9999), its configs are root-only, UGOS
# has no reverse-proxy setting, and hand edits under /etc/nginx are not ours to
# keep across firmware updates.
#
# Service without a selector + a hand-written EndpointSlice: Kubernetes does not
# manage the slice, so if the NAS address or the published port changes, edit
# it here. The label kubernetes.io/service-name is what ties the slice to the
# Service; without it Traefik sees a Service with no endpoints and returns 503.
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: home
spec:
  ports:
    - name: http
      port: 8096
      targetPort: 8899
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: jellyfin-nas
  namespace: home
  labels:
    kubernetes.io/service-name: jellyfin
    endpointslice.kubernetes.io/managed-by: manual
addressType: IPv4
ports:
  - name: http
    port: 8899
    protocol: TCP
endpoints:
  - addresses:
      - 198.18.1.105
    conditions:
      ready: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jellyfin
  namespace: home
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: jellyfin.k3s.beerloga.su
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jellyfin
                port:
                  number: 8096
