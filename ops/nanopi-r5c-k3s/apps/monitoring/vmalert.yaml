# vmalert: evaluates the alert rules (ops/alerting/vmalert/rules.yaml, applied
# as the ConfigMap vmalert-rules by ops/alerting/deploy.sh) against
# VictoriaMetrics and sends firing alerts to Alertmanager.
#
# No nodeSelector and no volume: it can run on any node, so a dead k3s-1 does
# not take alerting down with VictoriaMetrics. State of `for` timers is restored
# from VictoriaMetrics on start (-remoteRead.url), where vmalert also writes the
# ALERTS series (-remoteWrite.url) that the alerting dashboard reads.
#
# Sole alert evaluator since 2026-11-09: Grafana alerting is disabled
# (GF_UNIFIED_ALERTING_ENABLED=false in the Grafana container on the NAS,
# ops/nas-monitoring/docker-compose.yaml). The shadow-mode flag
# -external.label=shadow=true was removed at that cut-over; 16 hours of shadow
# run matched Grafana alert for alert.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmalert
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels: { app: vmalert }
  template:
    metadata:
      labels: { app: vmalert }
    spec:
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
      containers:
        - name: vmalert
          image: victoriametrics/vmalert@sha256:3256cba5ddaca5974eae6141105cec4ce37871f1c213f0a5c267ec0111bc68e1 # v1.155.0
          args:
            - -rule=/etc/vmalert/rules/*.yaml
            - -configCheckInterval=1m
            - -evaluationInterval=1m
            - -datasource.url=http://victoria-metrics.monitoring:8428
            - -remoteRead.url=http://victoria-metrics.monitoring:8428
            - -remoteWrite.url=http://victoria-metrics.monitoring:8428
            # Every Alertmanager replica, not the load-balanced Service: the
            # peers deduplicate through gossip, but only alerts each of them
            # received (alertmanager.yaml).
            - -notifier.url=http://alertmanager-0.alertmanager-peers.monitoring.svc:9093
            - -notifier.url=http://alertmanager-1.alertmanager-peers.monitoring.svc:9093
            - -notifier.url=http://alertmanager-2.alertmanager-peers.monitoring.svc:9093
          ports:
            - { containerPort: 8880, name: http }
          volumeMounts:
            - { name: rules, mountPath: /etc/vmalert/rules, readOnly: true }
          readinessProbe:
            httpGet: { path: /health, port: 8880 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits:   { memory: 128Mi }
      volumes:
        - name: rules
          configMap: { name: vmalert-rules }
---
apiVersion: v1
kind: Service
metadata:
  name: vmalert
  namespace: monitoring
spec:
  selector: { app: vmalert }
  ports:
    - { port: 8880, targetPort: 8880 }
