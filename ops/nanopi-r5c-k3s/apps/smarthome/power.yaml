# power — учёт потребления: читает MQTT, пишет в VictoriaMetrics.
# Устройство то же, что у humidity: без портов, conf на NFS.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: power
  namespace: smarthome
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: power }
  template:
    metadata:
      labels: { app: power }
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      imagePullSecrets:
        - name: registry-creds
      containers:
        - name: power
          image: registry.k3s.beerloga.su/power:c521877
          imagePullPolicy: IfNotPresent
          args:
            - --path
            - /app/conf
            - --mqtt
            - mosquitto.home
            - --victoria
            - victoria-metrics.monitoring
          env:
            - { name: TZ, value: Europe/Moscow }
          volumeMounts:
            - { name: conf, mountPath: /app/conf }
          # Heartbeat трогает главный цикл сервиса, так что проба ловит его
          # зависание; упавшую с исключением задачу TaskSupervisor гасит сам.
          # HEALTHCHECK из образа в k8s не действует — тот же порог 60 с
          # продублирован здесь.
          livenessProbe:
            exec:
              command:
                - python3
                - -c
                - "import os,sys,time; f='/tmp/power.heartbeat'; sys.exit(0 if os.path.exists(f) and time.time()-os.path.getmtime(f) < 60 else 1)"
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits:   { memory: 192Mi }
      volumes:
        - name: conf
          nfs:
            server: 198.18.1.125
            path: /mnt/HD/HD_a2/k8s/smarthome/power
