# conditioner — управление кондиционером через MQTT.
# В VictoriaMetrics не пишет, поэтому аргумента --victoria здесь нет.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conditioner
  namespace: smarthome
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: conditioner }
  template:
    metadata:
      labels: { app: conditioner }
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      imagePullSecrets:
        - name: registry-creds
      containers:
        - name: conditioner
          image: registry.k3s.beerloga.su/conditioner:c521877
          imagePullPolicy: IfNotPresent
          args:
            - --path
            - /app/conf
            - --mqtt
            - mosquitto.home
          env:
            - { name: TZ, value: Europe/Moscow }
          volumeMounts:
            - { name: conf, mountPath: /app/conf }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits:   { memory: 192Mi }
      volumes:
        - name: conf
          nfs:
            server: 198.18.1.125
            path: /mnt/HD/HD_a2/k8s/smarthome/conditioner
