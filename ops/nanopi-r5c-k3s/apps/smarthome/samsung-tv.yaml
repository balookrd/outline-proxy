# samsung_tv — управление телевизором, включая Wake-on-LAN.
#
# hostNetwork здесь не роскошь: WoL шлётся как sendto(('255.255.255.255', 9))
# с SO_BROADCAST, а из pod-сети 10.42.0.0/16 такой бродкаст в LAN не уйдёт.
# dnsPolicy обязателен вместе с hostNetwork — иначе под теряет кластерный DNS.
#
# /run/udev, который монтировал docker-скрипт, не переносится: в коде нет ни
# одного обращения к нему.
#
# ВНИМАНИЕ при первой раскатке: Samsung привязывает токен авторизации к
# клиенту, а клиент сменился (был .102, стала нода). Телевизоры могут
# потребовать подтверждения на экране — раскатывать, когда есть возможность
# подойти к ним с пультом.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: samsung-tv
  namespace: smarthome
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: samsung-tv }
  template:
    metadata:
      labels: { app: samsung-tv }
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      imagePullSecrets:
        - name: registry-creds
      # Reschedule ~1.7 min after a host dies (40s NotReady detect + 60s here),
      # not the 5-min default. Stateless single replica — safe to move fast; the
      # floor stays above a k3s restart / network blip so it does not churn.
      tolerations:
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
      containers:
        - name: samsung-tv
          image: registry.k3s.beerloga.su/samsung_tv:b433f60
          imagePullPolicy: IfNotPresent
          args:
            - --path
            - /app/conf
            - --mqtt
            - mosquitto.home
          env:
            - { name: TZ, value: Europe/Moscow }
          volumeMounts:
            - { name: conf, mountPath: /app/conf }
          # Heartbeat трогает главный цикл сервиса, так что проба ловит его
          # зависание (например, на записи в NFS); упавшую с исключением задачу
          # TaskSupervisor гасит сам. HEALTHCHECK из образа в k8s не действует —
          # тот же порог 60 с продублирован здесь.
          livenessProbe:
            exec:
              command:
                - python3
                - -c
                - "import os,sys,time; f='/tmp/samsung_tv.heartbeat'; sys.exit(0 if os.path.exists(f) and time.time()-os.path.getmtime(f) < 60 else 1)"
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits:   { memory: 192Mi }
      volumes:
        - name: conf
          nfs:
            server: 198.18.1.125
            path: /mnt/HD/HD_a2/k8s/smarthome/samsung_tv
