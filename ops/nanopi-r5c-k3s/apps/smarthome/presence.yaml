# presence — присутствие по iBeacon/ESPresense, публикует в MQTT.
# В VictoriaMetrics не пишет, поэтому аргумента --victoria здесь нет.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: presence
  namespace: smarthome
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: presence }
  template:
    metadata:
      labels: { app: presence }
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      imagePullSecrets:
        - name: registry-creds
      containers:
        - name: presence
          image: registry.k3s.beerloga.su/presence:c521877
          imagePullPolicy: IfNotPresent
          args:
            - --path
            - /app/conf
            - --mqtt
            - mqtt.beerloga.su
          env:
            - { name: TZ, value: Europe/Moscow }
          volumeMounts:
            - { name: conf, mountPath: /app/conf }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits:   { memory: 192Mi }
      volumes:
        - name: conf
          nfs:
            server: 198.18.1.125
            path: /mnt/HD/HD_a2/k8s/smarthome/presence
