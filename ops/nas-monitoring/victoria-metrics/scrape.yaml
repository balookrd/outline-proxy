scrape_configs:
- job_name: grafana
  static_configs:
  - targets:
    # Same compose project on the NAS: plain service name, no ingress.
    - grafana:3000
    labels:
      hostname: 'ubuntu'
  relabel_configs:
    - source_labels: [hostname]
      target_label: instance
- job_name: victoriametrics
  static_configs:
  - targets:
    - 127.0.0.1:8428
    labels:
      hostname: 'ubuntu'
  relabel_configs:
    - source_labels: [hostname]
      target_label: instance
- job_name: node-exporter
  static_configs:
  - targets:
    - 198.18.1.102:9100
    labels:
      hostname: 'ubuntu'
  - targets:
    - 198.18.1.104:9100
    labels:
      hostname: 'debian'
  - targets:
    - 198.18.1.51:9100
    labels:
      hostname: 'k3s-1'
  - targets:
    - 198.18.1.52:9100
    labels:
      hostname: 'k3s-2'
  - targets:
    - 198.18.1.53:9100
    labels:
      hostname: 'k3s-3'
  - targets:
    - https://cloud1.beerloga.su/node-exporter/metrics
    labels:
      hostname: 'cloud1'
  - targets:
    - https://cloud2.beerloga.su/node-exporter/metrics
    labels:
      hostname: 'cloud2'
  - targets:
    - https://nuxt.beerloga.su/node-exporter/metrics
    labels:
      hostname: 'nuxt'
  - targets:
    - https://nuxt2.beerloga.su/node-exporter/metrics
    labels:
      hostname: 'nuxt2'
  relabel_configs:
    - source_labels: [hostname]
      target_label: instance
- job_name: oc-exporter
  static_configs:
  - targets:
    - 198.18.1.102:9486
    labels:
      hostname: 'ubuntu'
  - targets:
    - 198.18.1.104:9486
    labels:
      hostname: 'debian'
  - targets:
    - https://cloud1.beerloga.su/ocserv-exporter/metrics
    labels:
      hostname: 'cloud1'
  - targets:
    - https://cloud2.beerloga.su/ocserv-exporter/metrics
    labels:
      hostname: 'cloud2'
  relabel_configs:
    - source_labels: [hostname]
      target_label: instance
- job_name: rust-ss-exporter
  # VM otherwise keeps idle scrape sockets open; outline-ss-rust logs them as
  # HeaderTimeout on .102/.104. Close after every scrape instead. This is only
  # HTTP connection reuse for scraping, not the Grafana dead-man heartbeat.
  disable_keepalive: true
  static_configs:
  - targets:
    - 198.18.1.102:9090
    labels:
      hostname: 'ubuntu'
  - targets:
    - 198.18.1.104:9090
    labels:
      hostname: 'debian'
  - targets:
    - https://cloud1.beerloga.su/rust-ss-exporter/metrics
    labels:
      hostname: 'cloud1'
  - targets:
    - https://cloud2.beerloga.su/rust-ss-exporter/metrics
    labels:
      hostname: 'cloud2'
  - targets:
    - https://nuxt.beerloga.su/rust-ss-exporter/metrics
    labels:
      hostname: 'nuxt'
  - targets:
    - https://nuxt2.beerloga.su/rust-ss-exporter/metrics
    labels:
      hostname: 'nuxt2'
  relabel_configs:
    - source_labels: [hostname]
      target_label: instance
- job_name: rust-ws-exporter
  # Keep the client-side metrics probes consistent with rust-ss-exporter. This
  # does not affect Grafana's alert/heartbeat webhooks.
  disable_keepalive: true
  static_configs:
  - targets:
    - 198.18.1.102:9091
    labels:
      hostname: 'ubuntu'
  - targets:
    - 198.18.1.104:9091
    labels:
      hostname: 'debian'
  - targets:
    - https://cloud1.beerloga.su/rust-ws-exporter/metrics
    labels:
      hostname: 'cloud1'
  - targets:
    - https://cloud2.beerloga.su/rust-ws-exporter/metrics
    labels:
      hostname: 'cloud2'
  relabel_configs:
    - source_labels: [hostname]
      target_label: instance
- job_name: unbound-exporter
  static_configs:
  - targets:
    - https://cloud1.beerloga.su/unbound-exporter/metrics
    labels:
      hostname: 'cloud1'
  - targets:
    - https://cloud2.beerloga.su/unbound-exporter/metrics
    labels:
      hostname: 'cloud2'
  - targets:
    - https://nuxt.beerloga.su/unbound-exporter/metrics
    labels:
      hostname: 'nuxt'
  - targets:
    - https://nuxt2.beerloga.su/unbound-exporter/metrics
    labels:
      hostname: 'nuxt2'
  relabel_configs:
    - source_labels: [hostname]
      target_label: instance
- job_name: vmalert
  static_configs:
  - targets:
    # vmalert stays in k3s; the NAS reaches it through Traefik. No hairpin
    # here: the NAS is outside the cluster.
    - https://vmalert.k3s.beerloga.su/metrics
  relabel_configs:
    # Keep the instance value the series had while scraped by ClusterIP, so
    # history does not split into two series at the move.
    - target_label: instance
      replacement: vmalert.monitoring:8880
# Alertmanager runs as three gossip peers (StatefulSet). Each replica has its
# own /metrics name (ingress alertmanager-replicas): the load-balanced
# alertmanager.k3s would land on a random peer per scrape and counters would
# jump between pods under one series. instance = pod name. Series from before
# 2026-11-09 carry instance="alertmanager.monitoring:9093"; dashboards sum by
# integration, so the split does not show there.
- job_name: alertmanager
  static_configs:
  - targets:
    - https://alertmanager-0.k3s.beerloga.su/metrics
    - https://alertmanager-1.k3s.beerloga.su/metrics
    - https://alertmanager-2.k3s.beerloga.su/metrics
  relabel_configs:
    - source_labels: [__address__]
      regex: (?:https://)?(alertmanager-[0-9]+)\..*
      target_label: instance
      replacement: $1
